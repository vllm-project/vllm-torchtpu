[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm_torchtpu"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "vllm_torchtpu Contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tpu-info",
    "portpicker",
    "pathwaysutils",
    "vllm==0.22.1",
    "torch==2.11.0",
    "torch-tpu==0.1.1.dev20260630090312",
    # jaxlib 0.10.0 is required by the fused GDN prefill scan kernel
    # (recurrent_scan_v2 / chunked_kernel_pd): jaxlib 0.9.2's Mosaic rejects its
    # tiled-squeeze. Verified compatible with the pinned torch-tpu wheel.
    "jax==0.10.0",
    "jaxlib==0.10.0",
    # libtpu 0.0.41 regresses 30B decode TPOT ~2.9x in CI; keep 0.0.40 until fixed.
    "libtpu==0.0.40",
    "ray[default]",
    "ray[data]",
]

[project.optional-dependencies]
# Required for running tests
test = [
    "pytest",
    "pytest-mock",
    "pytest-timeout",
    "parameterized",
]

# Dev tools (linting, formatting)
dev = [
    "yapf>=0.43.0",
]

# These are required for running any benchmarking
# See more information at scripts/vllm/benchmarking/README.md
benchmarking = [
    "nltk",
    "evaluate",
    "datasets",
    "rouge-score",
    "scikit-learn",
    "pandas",
    "lm-eval[api]==0.5.0.dev1",
    "evalplus",
]

[project.entry-points."vllm.platform_plugins"]
# Standard vLLM out-of-tree platform plugin discovery. The function returns
# the dotted class path when this platform should activate, else None. See
# https://docs.vllm.ai/en/latest/design/plugin_system/
torchtpu = "vllm_torchtpu.platforms:register_tpu_platform"

[tool.pytest.ini_options]
markers = [
    "nightly: tests that only run in the nightly CI workflow",
]

[tool.setuptools]
include-package-data = true
py-modules = ["sitecustomize"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_torchtpu*"]

[tool.setuptools_scm]

[tool.uv]
keyring-provider = "subprocess"
# vLLM 0.17.1 pins numba==0.61.2, which conflicts with our requirements.
# We override the numba version to >=0.62.1 to allow resolution to succeed.
override-dependencies = [
    "numba>=0.62.1",
    # Restrict fastapi version due to https://github.com/vllm-project/vllm/pull/45629
    # TODO(shobhitbehl): Remove this pin after the fix is released in vLLM 0.23.0 or later.
    "fastapi<0.137",
]


[[tool.uv.index]]
name = "torch-tpu-registry"
# torch-tpu-virtual-registry is a virtual registry that combines the PyTorch CPU index, Torch TPU index,
# and the PyPI index. It priortizes package installs as such: PyTorch CPU index > Torch TPU index > PyPI index.
url = "https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-virtual-registry/simple/"
explicit = true

[tool.uv.sources]
torch-tpu = { index = "torch-tpu-registry" }
