[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm_torchtpu"
dynamic = ["version"]
description = ""
readme = "README.md"
# 3.12 only: every tpu-raiden-torch wheel is cp312-only, so any other interpreter
# fails to resolve. Stating it here makes that an up-front error rather than an
# unsatisfiable-requirements failure partway through a Docker build.
requires-python = ">=3.12,<3.13"
authors = [
    { name = "vllm_torchtpu Contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tpu-info",
    "portpicker",
    "pathwaysutils",
    # Note: we **intentionally** build vllm from source, see README.
    # Keep the native KV cache placement API aligned with vLLM 0.29.0.
    "vllm @ git+https://github.com/vllm-project/vllm.git@v0.29.0",
    "torch==2.13.0",
    # Some multimodal checkpoints dynamically invoke torchvision at class-definition
    # time in their HF processors. torchvision's pre-compiled ops (nms and friends)
    # are built against a specific torch ABI, so this stays pinned in lockstep with
    # torch==2.13.0 above; a mismatched pair fails at operator-registration time,
    # not at install time.
    "torchvision==0.28.0",
    "torch-tpu==0.1.1.dev20260912075415",
    # High-bandwidth PJRT raw-transfer / KV-cache DMA engine backing the
    # raiden KV connector (disaggregated serving) and host KV offload; the
    # import name is `tpu_sync`. The wheel bundles one extension per
    # supported torch ABI and dispatches to the variant matching the
    # installed torch at import time. Published to PyPI as nightly .dev
    # pre-releases, so it needs no registry source below.
    "tpu-sync-torch==0.0.1.dev20260923040928",
    # Imported directly by src/vllm_torchtpu/models/vllm/qwen3_vl_patch.py, so
    # declared here rather than leaned on as a vLLM transitive.
    #
    # Capped below 5.15. vLLM 0.29.0 sets a floor (>=5.10.4), and vllm-omni 0.29.0rc1
    # requires transformers>=5.13.0,<5.15. The previous <5.11 ceiling was added
    # defensively after floating to 5.17.0 produced an argmax tie-break divergence in
    # test_structured_output_spec_decode_correctness_greedy. Widening to <5.15 allows
    # vllm-torchtpu[omni] to resolve (to 5.14.x) while remaining bounded below 5.15+.
    "transformers>=5.10.4,<5.15",
    # Required for N-gram speculative decoding
    # vLLM only lists it in its per-platform requirements/*.txt files (cuda.txt,
    # cpu.txt, ...) except tpu.txt, so it's missing
    # when installing vllm as a plain PyPI dependency for our TPU platform.
    "numba==0.65.0",
    # See the JAX fori-loop lowering monkey-patch in
    # src/vllm_torchtpu/env_override.py; it works around a Pallas remainder-loop
    # bloat this JAX pin regresses on (validated on Qwen3.5-397B DP=8 EP).
    "jax==0.10.2",
    "jaxlib==0.10.2",
    # tpu-sync-torch requires libtpu>=0.0.47. The workarounds in
    # src/vllm_torchtpu/env_override.py (SC-offload threshold gate) and the
    # per-config LIBTPU_INIT_ARGS additions under
    # scripts/vllm/benchmarking/configs/ were tuned against an earlier libtpu;
    # re-verify those runs when bumping.
    "libtpu==0.0.47",
    "ray[default]",
    "ray[data]",
]

[project.optional-dependencies]
# Required for running tests
test = [
    # tests/kernels/ and tests/layers/ use absl.testing.
    "absl-py",
    "pytest",
    "pytest-mock",
    "pytest-timeout",
    "pytest-cov",
    "parameterized",
    "vllm_test_utils @ git+https://github.com/vllm-project/vllm.git@v0.29.0#subdirectory=tests/vllm_test_utils",
]

# These are required for running any benchmarking
# See more information at scripts/vllm/benchmarking/README.md
benchmarking = [
    "nltk",
    "evaluate",
    "datasets",
    "rouge-score",
    "scikit-learn",
    "pandas",
    "lm-eval[api]==0.5.0.dev1",
    "evalscope==1.10.0",
    # Stream gs:// checkpoints via --load-format runai_streamer (multihost
    # v7x-16 hosts have no disk for an HF download).
    "runai-model-streamer[gcs]",
]

# vLLM-Omni optional dependency
omni = [
    "vllm-omni==0.29.0rc1",
]

[project.entry-points."vllm.platform_plugins"]
# Standard vLLM out-of-tree platform plugin discovery. The function returns
# the dotted class path when this platform should activate, else None. See
# https://docs.vllm.ai/en/latest/design/plugin_system/
torchtpu = "vllm_torchtpu.platforms:register_tpu_platform"

[project.entry-points."vllm_omni.platform_plugins"]
torchtpu = "vllm_torchtpu.omni:register_omni_tpu_platform"

[project.entry-points."vllm.general_plugins"]
torchtpu_layers = "vllm_torchtpu.layers:register_layers"

[tool.pytest.ini_options]
markers = [
    "cpu_test: tests that run without accelerator hardware",
    "nightly: tests that only run in the nightly CI workflow",
    "multichip: tests that need more than 2 TPU chips; CI runs them on an 8-chip agent",
    "spawns_tpu_workers: tests that spawn a torch.distributed.run worker group spanning the TPU slice; must run before any in-process TPU test in the same pytest session",
]

[tool.ruff]
# Without this, ruff ignores its `exclude` lists for any path named directly
# on the command line, which is exactly how pre-commit invokes it. Setting it
# makes `exclude` hold for both `ruff format .` and the hook.
force-exclude = true

# protoc writes this file; see scripts/update_xplane_proto.sh. Reformatting it
# would make every regeneration produce a spurious diff.
exclude = ["src/vllm_torchtpu/tools/xplane_pb2.py"]

[tool.ruff.lint]
# E4 import placement, E7 statement mistakes, E9 unreadable file, F pyflakes,
# I import sorting, UP outdated syntax, B likely bugs, SIM needless complexity,
# G logging calls, ISC string concatenation.
# Line length (E501) is in E5 and is not selected.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "G", "ISC"]

ignore = [
    # Off on purpose, matching upstream vllm.
    "B905",   # zip() without an explicit strict=
    "B007",   # loop control variable not used in the body
    "UP032",  # .format() that could be an f-string

    # Firing today and not fixed yet. `ruff check --fix` does not clear any of
    # them; a few have fixes that ruff marks unsafe. Each one is a follow-up
    # change. Delete the entry once its count reaches zero.
    "G004",    #  39  f-string passed to a logging call
    "SIM108",  #  15  if/else that could be a conditional expression
    "SIM102",  #  13  nested if that could be one
    "SIM105",  #  12  try/except/pass that could be contextlib.suppress
    "SIM115",  #   1  open() outside a context manager
]

[tool.ruff.lint.per-file-ignores]
# Pallas runs a kernel closure the moment it is defined: `pl.when` and
# `pl.loop` trace the body during the decorator call, inside the iteration
# that built it. B023 warns that a closure outliving its loop sees the last
# value of the loop variable, which cannot happen to a body that never
# outlives the iteration.
#
# Switching the rule off here would also hide a capture that does escape, so
# tools/check_b023_baseline.py counts the findings per file and fails when a
# file gains one. Both move together.
"src/vllm_torchtpu/kernels/**" = ["B023"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyrefly]
project-includes = ["src"]

# Start at `basic`, which covers unambiguous mistakes (undefined names, bad
# unpacking, wrong keyword arguments). Raising this to `default` adds ~300 more
# findings, mostly attribute and argument types on the JAX/torch boundary;
# that is worth doing as follow-up work, not as part of enabling the checker.
preset = "basic"

# CI runs pre-commit without installing our dependencies, and `vllm` is
# installed as an editable package behind a custom path hook that no static
# checker can resolve. Listing these makes an unresolved import degrade to
# `Any` instead of erroring, so local and CI runs agree. `ignore-missing-imports`
# only applies when the module is genuinely unresolvable - when a package is
# installed with type information, it is still checked normally.
ignore-missing-imports = [
    "compressed_tensors", "compressed_tensors.*",
    "einops", "einops.*",
    "google.protobuf", "google.protobuf.*",
    "jax", "jax.*",
    "jaxlib", "jaxlib.*",
    "numpy", "numpy.*",
    "packaging", "packaging.*",
    "pathwaysutils", "pathwaysutils.*",
    "portpicker", "portpicker.*",
    "ray", "ray.*",
    "requests", "requests.*",
    "sympy", "sympy.*",
    "torch", "torch.*",
    "torch_tpu", "torch_tpu.*",
    "runai_model_streamer", "runai_model_streamer.*",
    "tpu_sync", "tpu_sync.*",
    "tqdm", "tqdm.*",
    "transformers", "transformers.*",
    "vllm", "vllm.*",
    "vllm_omni", "vllm_omni.*",
    "zmq", "zmq.*",
]

[tool.setuptools]
include-package-data = true
py-modules = ["sitecustomize"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_torchtpu*"]

[tool.setuptools_scm]

[tool.uv]
keyring-provider = "subprocess"

[[tool.uv.index]]
name = "torch-tpu-registry"
# torch-tpu-virtual-registry is a virtual registry that combines the PyTorch CPU index, Torch TPU index,
# and the PyPI index. It priortizes package installs as such: PyTorch CPU index > Torch TPU index > PyPI index.
url = "https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-virtual-registry/simple/"
explicit = true

[tool.uv.sources]
torch-tpu = { index = "torch-tpu-registry" }
