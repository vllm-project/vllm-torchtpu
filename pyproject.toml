[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm_torchtpu"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "vllm_torchtpu Contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tpu-info",
    "portpicker",
    "pathwaysutils",
    # Note: we **intentionally** build vllm from source, see README.
    # vllm==0.27.0 is required for Kimi K3 compatibility
    "vllm @ git+https://github.com/vllm-project/vllm.git@v0.27.0",
    "torch==2.13.0",
    # Some multimodal checkpoints dynamically invoke torchvision at class-definition
    # time in their HF processors. We must explicitly pin torchvision statically
    # matching our torch==2.13.0 constraint to prevent the CI Docker base image
    # from leaking structurally incompatible pre-compiled nms operators!
    "torchvision==0.28.0",
    "torch-tpu==0.1.1.dev20260910000446",
    # High-bandwidth PJRT raw-transfer / KV-cache DMA engine backing the
    # raiden KV connector (disaggregated serving) and host KV offload. The
    # wheel bundles one extension per supported torch ABI and dispatches to
    # the variant matching the installed torch at import time.
    "tpu-raiden-torch==0.0.1.dev20260827124357",
    # Required for N-gram speculative decoding
    # vLLM only lists it in its per-platform requirements/*.txt files (cuda.txt,
    # cpu.txt, ...) except tpu.txt, so it's missing
    # when installing vllm as a plain PyPI dependency for our TPU platform.
    "numba==0.65.0",
    # See the JAX fori-loop lowering monkey-patch in
    # src/vllm_torchtpu/env_override.py; it works around a Pallas remainder-loop
    # bloat this JAX pin regresses on (validated on Qwen3.5-397B DP=8 EP).
    "jax==0.10.2",
    "jaxlib==0.10.2",
    # This libtpu pin needs the workarounds in src/vllm_torchtpu/env_override.py
    # (SC-offload threshold gate) and the per-config LIBTPU_INIT_ARGS additions
    # under scripts/vllm/benchmarking/configs/. Re-verify those runs before
    # bumping.
    "libtpu==0.0.44.1",
    "ray[default]",
    "ray[data]",
]

[project.optional-dependencies]
# Required for running tests
test = [
    "pytest",
    "pytest-mock",
    "pytest-timeout",
    "pytest-cov",
    "parameterized",
    "vllm_test_utils @ git+https://github.com/vllm-project/vllm.git@v0.27.0#subdirectory=tests/vllm_test_utils",
]

# Dev tools (linting, formatting)
dev = [
    "yapf>=0.43.0",
]

# These are required for running any benchmarking
# See more information at scripts/vllm/benchmarking/README.md
benchmarking = [
    "nltk",
    "evaluate",
    "datasets",
    "rouge-score",
    "scikit-learn",
    "pandas",
    "lm-eval[api]==0.5.0.dev1",
    "evalscope==1.10.0",
    # Stream gs:// checkpoints via --load-format runai_streamer (multihost
    # v7x-16 hosts have no disk for an HF download).
    "runai-model-streamer[gcs]",
]

# vLLM-Omni optional dependency
omni = [
    "vllm-omni==0.27.0rc1",
]

[project.entry-points."vllm.platform_plugins"]
# Standard vLLM out-of-tree platform plugin discovery. The function returns
# the dotted class path when this platform should activate, else None. See
# https://docs.vllm.ai/en/latest/design/plugin_system/
torchtpu = "vllm_torchtpu.platforms:register_tpu_platform"

[project.entry-points."vllm_omni.platform_plugins"]
torchtpu = "vllm_torchtpu.omni:register_omni_tpu_platform"

[project.entry-points."vllm.general_plugins"]
torchtpu_layers = "vllm_torchtpu.layers:register_layers"

[tool.pytest.ini_options]
markers = [
    "cpu_test: tests that run without accelerator hardware",
    "nightly: tests that only run in the nightly CI workflow",
    "multichip: tests that need more than 2 TPU chips; CI runs them on an 8-chip agent",
    "spawns_tpu_workers: tests that spawn a torch.distributed.run worker group spanning the TPU slice; must run before any in-process TPU test in the same pytest session",
]

[tool.pyrefly]
project-includes = ["src"]

# Start at `basic`, which covers unambiguous mistakes (undefined names, bad
# unpacking, wrong keyword arguments). Raising this to `default` adds ~300 more
# findings, mostly attribute and argument types on the JAX/torch boundary;
# that is worth doing as follow-up work, not as part of enabling the checker.
preset = "basic"

# CI runs pre-commit without installing our dependencies, and `vllm` is
# installed as an editable package behind a custom path hook that no static
# checker can resolve. Listing these makes an unresolved import degrade to
# `Any` instead of erroring, so local and CI runs agree. `ignore-missing-imports`
# only applies when the module is genuinely unresolvable - when a package is
# installed with type information, it is still checked normally.
ignore-missing-imports = [
    "compressed_tensors", "compressed_tensors.*",
    "einops", "einops.*",
    "google.protobuf", "google.protobuf.*",
    "jax", "jax.*",
    "jaxlib", "jaxlib.*",
    "numpy", "numpy.*",
    "packaging", "packaging.*",
    "pathwaysutils", "pathwaysutils.*",
    "portpicker", "portpicker.*",
    "ray", "ray.*",
    "requests", "requests.*",
    "sympy", "sympy.*",
    "torch", "torch.*",
    "torch_tpu", "torch_tpu.*",
    "runai_model_streamer", "runai_model_streamer.*",
    "tpu_sync", "tpu_sync.*",
    "tqdm", "tqdm.*",
    "transformers", "transformers.*",
    "vllm", "vllm.*",
    "vllm_omni", "vllm_omni.*",
    "zmq", "zmq.*",
]

[tool.setuptools]
include-package-data = true
py-modules = ["sitecustomize"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_torchtpu*"]

[tool.setuptools_scm]

[tool.uv]
keyring-provider = "subprocess"

[[tool.uv.index]]
name = "torch-tpu-registry"
# torch-tpu-virtual-registry is a virtual registry that combines the PyTorch CPU index, Torch TPU index,
# and the PyPI index. It priortizes package installs as such: PyTorch CPU index > Torch TPU index > PyPI index.
url = "https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-virtual-registry/simple/"
explicit = true

[tool.uv.sources]
torch-tpu = { index = "torch-tpu-registry" }
tpu-raiden-torch = { index = "torch-tpu-registry" }
