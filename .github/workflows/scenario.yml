# Presubmit for the scenario tool (tools/scenario) and the CI scenarios: the
# lock check, the tool's tests (the multi-process ones in a step of their
# own) and the checks over the scenarios on both supported Pythons, the
# generated-files check and a validate of every scenario.
#
# Path filter: it runs only for changes to the tool, the CI scenarios
# (.buildkite/kubernetes/scenarios/), the checks over them
# (.buildkite/kubernetes/scenario/) or this file, so other pull requests
# neither run it nor fail on it.
name: scenario

on:
  pull_request:
    paths:
      - "tools/scenario/**"
      - ".buildkite/kubernetes/scenarios/**"
      - ".buildkite/kubernetes/scenario/**"
      - ".github/workflows/scenario.yml"
  push:
    branches: [main]
    paths:
      - "tools/scenario/**"
      - ".buildkite/kubernetes/scenarios/**"
      - ".buildkite/kubernetes/scenario/**"
      - ".github/workflows/scenario.yml"

permissions:
  contents: read

jobs:
  scenario:
    if: github.repository == 'vllm-project/vllm-torchtpu'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # The version that wrote tools/scenario/uv.lock, so the lock check
          # does not depend on when uv last released.
          version: "0.12.15"
      - name: Lock file is current
        run: uv lock --check --project tools/scenario
      # -c keeps the root project's pytest settings out.
      - name: Tests (Python 3.12)
        run: >-
          uv run --project tools/scenario --frozen --python 3.12
          pytest -c tools/scenario/pyproject.toml tools/scenario/tests
          .buildkite/kubernetes/scenario/tests
      - name: Tests (Python 3.13)
        run: >-
          uv run --project tools/scenario --frozen --python 3.13
          pytest -c tools/scenario/pyproject.toml tools/scenario/tests
          .buildkite/kubernetes/scenario/tests
      # Several `scenario run` processes per test: hosts of one run on the
      # runner, against stub servers.
      - name: Multi-process tests (Python 3.12)
        run: >-
          uv run --project tools/scenario --frozen --python 3.12
          pytest -c tools/scenario/pyproject.toml -m multiprocess tools/scenario/tests
      - name: Multi-process tests (Python 3.13)
        run: >-
          uv run --project tools/scenario --frozen --python 3.13
          pytest -c tools/scenario/pyproject.toml -m multiprocess tools/scenario/tests
      - name: Generated schemas and REFERENCE.md are current
        run: uv run --project tools/scenario --frozen --no-dev scenario dev regen --check
      - name: Every scenario validates
        run: >-
          uv run --project tools/scenario --frozen --no-dev
          scenario validate --root .buildkite/kubernetes
