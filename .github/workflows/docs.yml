name: Docs

# mkdocs.yml sets `strict: true`, so a broken nav entry or an unresolved
# relative link fails the published build, not the merged commit: Read the
# Docs only runs after the change is already on main. pre-commit catches
# markdown syntax (pymarkdown) but never builds the site, so the two checks
# do not overlap. This gate runs the same build here, before the merge.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - '.readthedocs.yaml'
      - 'docs/requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site with the published Python
    # Python 3.13 mirrors the `build.tools.python` in .readthedocs.yaml, so a
    # green run here means the same interpreter Read the Docs uses is green.
    # The docs build only needs docs/requirements.txt; the package itself is
    # not installed, so `requires-python ==3.12.*` in pyproject.toml does not
    # bind this job.
    # A GitHub-hosted runner is enough here (the site builds in ~3 s on 2 vCPU)
    # and keeps the job runnable on fork PRs without occupying the self-hosted
    # capacity the pre-commit and TPU jobs reserve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: mkdocs build --strict
        # Built into $RUNNER_TEMP so a local `mkdocs build` never leaves an
        # untracked site/ next to the checked-out tree.
        run: mkdocs build --strict --clean --site-dir "$RUNNER_TEMP/mkdocs-site"
