name: Run Tests on TPU

on:
  workflow_call:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: string
        default: 'no'
      wheel-gcs-path:
        description: 'GCS path to the built wheel to test. If provided, installs this instead of source.'
        type: string
        default: ''
      nightly:
        description: 'Whether this is a nightly run (runs all tests including nightly-only).'
        type: string
        default: 'false'

jobs:
  run_tests:
    if: false && github.repository == 'vllm-project/vllm-torchtpu'
    name: "Tests on ${{ matrix.job_info.runner }}"
    strategy:
      matrix:
        job_info: [
          {
            runner: "linux-x86-tpu7x-224-4tpu",
            container: "us-docker.pkg.dev/ml-oss-artifacts-transient/torch-tpu-docker-container/torchtpu-vllm-ci:latest",
          }
        ]
        python-version: [3.12]
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
      # TODO investigate making a GH Action to make all this preamble reusable.
      options: --privileged --net=host --shm-size=16g --device /dev/fuse
      env:
        HF_HOME: /local_hf_cache
        SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        UV_INDEX_TORCH_TPU_REGISTRY_USERNAME: oauth2accesstoken

    env:
      FORCE_COLOR: "1"
      # Disable UV cache to save disk space on self-hosted runners
      UV_NO_CACHE: "1"

    steps:
      - name: Redirect torch_tpu cache off /dev/shm
        run: |
          # /dev/shm is too small on K8s runners; symlink to disk so the
          # tier-2 compilation cache still works without filling tmpfs.
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Mark git directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Virtual Environment
        run: |
          uv venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Keyring for Auth
        run: |
          uv pip install --no-config --index-url https://pypi.org/simple keyring keyrings.google-artifactregistry-auth
          echo UV_INDEX_TORCH_TPU_REGISTRY_USERNAME="oauth2accesstoken" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: uv pip install ".[test]"

      # In nightly workflow, we test the torchtpu-vllm package by installing the
      # prebuilt wheel instead of building from source.
      - name: Install torchtpu-vllm using prebuilt wheel
        if: ${{ inputs.wheel-gcs-path != '' }}
        run: |
          # Download the torchtpu-vllm wheel from GCS
          mkdir -p dist
          gcloud storage cp "${{ inputs.wheel-gcs-path }}/*.whl" dist/

          WHEEL_FILE=$(ls dist/*.whl)
          uv pip install "${WHEEL_FILE}"

      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@9f8d7d8d9954430d0fef4a8cce2cb4e3844c200d
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Install crc32c for gsutil
        run: uv pip install crc32c

      - name: Copy model to local cache
        run: |
          mkdir -p /local_hf_cache/hub
          gsutil -m cp -r gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3-0.6B/ /local_hf_cache/hub/
          gsutil -m cp -r gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3-Coder-30B-A3B-Instruct/ /local_hf_cache/hub/

      - name: Run tests
        run: bash ./scripts/vllm/benchmarking/run_unit_test.sh ${{ inputs.nightly }}
