# Adapted from vllm-project/vllm/.github/workflows/issue_autolabel.yml:
# only explicit title tags are matched here; issue templates supply labels too.
name: Label Issues

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

concurrency:
  group: issue-labeler-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label-issue:
    if: github.repository == 'vllm-project/vllm-torchtpu'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Add labels from explicit title tags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const rules = [
              ['bug', /\[bug(?:fix)?\]/i],
              ['documentation', /\[(?:docs?|documentation)\]/i],
              ['model-support', /\[(?:model(?:[ -]+support)?|new[ -]+model)\]/i],
            ];
            const existing = new Set(issue.labels.map(label => label.name));
            const labels = rules
              .filter(([label, pattern]) => pattern.test(issue.title) && !existing.has(label))
              .map(([label]) => label);
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels,
              });
            }
