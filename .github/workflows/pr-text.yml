name: PR Text

# The repo is public, so internal links and IDs stay out of PR branch names,
# titles, and descriptions, not only out of the code (R-7.12 in
# docs/developers_guide/coding_guidance.md). A squash merge copies the title
# into the history of main. pre-commit cannot see PR metadata, so this check
# reads GITHUB_EVENT_PATH directly inside tools/check_internal_refs.py without
# passing PR fields through step env (which actions/runner prints into job
# logs). Sparse checkout needs only `contents: read`, so it works on fork PRs.
#
# Pattern logic is shared with the `no-internal-refs` pre-commit hook in
# tools/check_internal_refs.py. The log names where a match is, never the
# match itself, so a failing run does not repeat it.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-text:
    name: No Internal Links in PR Text
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out internal reference checker
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/check_internal_refs.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
      - name: Check the PR title, description, and branch name
        run: python3 tools/check_internal_refs.py --pr-event "$GITHUB_EVENT_PATH"
