name: PR Text

# The repo is public, so internal links and IDs stay out of PR branch names,
# titles, and descriptions, not only out of the code (R-7.12 in
# docs/developers_guide/coding_guidance.md). A squash merge copies the title
# into the history of main. pre-commit cannot see PR metadata, so this check
# reads the event payload. Like ready-label.yml it needs no checkout and no
# token, so it also works on fork PRs.
#
# The pattern is wider than the `no-internal-refs` pre-commit hook: PR metadata
# also tends to carry unspaced tracker IDs (such as "cl123456" in branch names),
# spaced "CL 123456", and "buganizer". The log names where a match is, never the
# match itself, so a failing run does not repeat it.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-text:
    name: No Internal Links in PR Text
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check the PR title, description, and branch name
        # The title, body, and branch name are untrusted input: pass them
        # through env, never through ${{ }} inside the script, where they
        # would run as code.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import sys

          pattern = re.compile(
              r"""(?:^|[\s(\[{"'`<,]|https?://)go/[A-Za-z]"""
              r"""|(?i:(?<![A-Za-z0-9])(?:b/[0-9]{6,}|cl/[0-9]{6,}|xid/[0-9]{5,}|yaqs/[0-9]{5,})"""
              r"""|\bgoogle3\b|\bcl\s+[0-9]{6,}"""
              r"""|(?<![A-Za-z0-9])(?:b[0-9]{8,}|cl[0-9]{6,})(?![A-Za-z0-9])|\bbuganizer\b"""
              r"""|\b(?:corp|prod|goto)\.google\.com\b|\bgoogleplex\b"""
              r"""|\bc\.googlers\.com\b|(?<![A-Za-z0-9])j-[0-9a-f]{8}(?![A-Za-z0-9]))""",
          )
          places = []
          if pattern.search(os.environ.get("PR_HEAD_REF", "")):
              places.append("the branch name")
          if pattern.search(os.environ["PR_TITLE"]):
              places.append("the title")
          for i, line in enumerate(os.environ.get("PR_BODY", "").splitlines(), 1):
              if pattern.search(line):
                  places.append(f"line {i} of the description")
          if not places:
              print("No internal links in the PR branch name, title, or description.")
              sys.exit(0)
          for place in places:
              print(f"::error::Internal link or ID in {place}.")
          print(
              "This repo is public. Remove go/ links, b/ and cl/ numbers, internal "
              "job IDs, internal code paths, and internal hosts from the branch name, "
              "PR title, and description (R-7.12 in docs/developers_guide/coding_guidance.md). "
              "Editing the PR re-runs this check for title and description fixes; "
              "branch-name matches require pushing from a renamed branch."
          )
          sys.exit(1)
          EOF
