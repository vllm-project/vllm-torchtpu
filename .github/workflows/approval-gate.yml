name: Approval Gate

# Reports whether a PR has the CODEOWNERS approvals our policy requires: at
# least one approval from the owners of every area the PR touches.
#
# This check is ADVISORY today. Branch protection and rulesets are unavailable
# on this repository's plan, so nothing stops a merge with the gate unmet, and
# an unmet gate is reported grey rather than red -- see
# MISSING_APPROVAL_CONCLUSION below. Making it block is two changes once
# rulesets land: that env, and marking the check required. See
# docs/PRE_PUBLIC_DEV_GUIDE.md.
#
# The verdict is a check run this workflow owns and updates in place, not the
# job's own pass/fail. A job's check run belongs to the run that created it, so
# the `pull_request` and `pull_request_review` runs would each leave one on the
# same commit and the earlier verdict would never clear.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read
  # To create and update the check run that carries the verdict.
  checks: write

concurrency:
  group: approval-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Label that bypasses the gate, for emergencies (e.g. reverting a broken
  # main when the owner is unreachable). Every use is logged as a warning.
  OVERRIDE_LABEL: approval-gate-override
  # When true, an approval only counts against the current head commit --
  # GitHub's "dismiss stale reviews". Off by default because the DCO fix we
  # document (`git commit --amend --signoff` + force push) rewrites the head
  # SHA and would discard every approval. Stale ones are reported either way.
  STRICT_STALE_APPROVALS: 'false'
  # Conclusion published when an area is missing its owner's approval.
  # `neutral` renders grey rather than red and keeps the PR out of the "some
  # checks were not successful" banner, which is what we want while the gate
  # is advisory: every PR is missing approvals for the whole window between
  # opening it and being reviewed, and a red X for that whole window trains
  # people to ignore the check. `failure` is the setting to switch to when
  # branch rulesets arrive and the gate is meant to block.
  MISSING_APPROVAL_CONCLUSION: neutral

jobs:
  check-approvals:
    # Plumbing only: green whenever the gate ran at all. The verdict lives in
    # the CODEOWNERS Approval check run.
    name: Run Approval Gate
    if: >-
      github.repository == 'vllm-project/vllm-torchtpu' &&
      github.event.pull_request.draft == false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # refs/pull/N/merge, so the resolver runs as the PR leaves it and a change
      # to find_owners.py is exercised by the gate before it lands. Pinning it
      # to the base branch would buy no safety: GitHub runs this workflow file
      # from the same merge ref.
      - name: Check out the PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CODEOWNERS is the exception: it is the policy, not the code enforcing
      # it. GitHub evaluates ownership from the base branch, so a PR cannot
      # grant itself ownership of a directory until it merges.
      - name: Read CODEOWNERS from the base branch
        run: |
          if git cat-file -e "${BASE_SHA}:.github/CODEOWNERS" 2>/dev/null; then
            git show "${BASE_SHA}:.github/CODEOWNERS" \
              > "${RUNNER_TEMP}/CODEOWNERS"
          else
            echo "No CODEOWNERS on the base branch; nothing to gate." >&2
            : > "${RUNNER_TEMP}/CODEOWNERS"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve CODEOWNERS groups for the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Only reachable if a PR deletes the resolver. Say so plainly rather
          # than failing on a stack trace.
          if [ ! -f scripts/find_owners.py ]; then
            echo "scripts/find_owners.py is missing; nothing to gate." >&2
            echo '{"groups": []}' > "${RUNNER_TEMP}/owners.json"
            exit 0
          fi
          python3 scripts/find_owners.py \
            --pr "${PR_NUMBER}" \
            --repo "${REPO}" \
            --codeowners "${RUNNER_TEMP}/CODEOWNERS" \
            --json | tee "${RUNNER_TEMP}/owners.json"

      - name: Validate approvals
        uses: actions/github-script@v7
        env:
          OWNERS_JSON: ${{ runner.temp }}/owners.json
        with:
          script: |
            const fs = require('fs');
            const { groups } = JSON.parse(
              fs.readFileSync(process.env.OWNERS_JSON, 'utf8'));

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const author = pr.user.login.toLowerCase();
            const headSha = pr.head.sha;
            const strict = process.env.STRICT_STALE_APPROVALS === 'true';
            // Anything other than `failure` is treated as advisory, so a typo
            // in the env cannot turn the gate red by accident.
            const missingConclusion =
              process.env.MISSING_APPROVAL_CONCLUSION === 'failure'
                ? 'failure' : 'neutral';

            // Updated in place so a commit never carries two verdicts.
            const CHECK_NAME = 'CODEOWNERS Approval';
            async function publish(conclusion, title, summary) {
              const found = await github.rest.checks.listForRef({
                owner, repo, ref: headSha, check_name: CHECK_NAME, per_page: 1,
              });
              const body = {
                owner, repo, name: CHECK_NAME, head_sha: headSha,
                status: 'completed', conclusion,
                output: { title, summary },
              };
              const prior = found.data.check_runs[0];
              if (prior) {
                await github.rest.checks.update(
                  { ...body, check_run_id: prior.id });
              } else {
                await github.rest.checks.create(body);
              }
              core.info(`${CHECK_NAME}: ${conclusion} -- ${title}`);
            }

            const overrideLabel = process.env.OVERRIDE_LABEL.toLowerCase();
            const labels = (pr.labels || []).map(l => l.name.toLowerCase());
            if (labels.includes(overrideLabel)) {
              core.warning(
                `Approval gate bypassed via the '${overrideLabel}' label. ` +
                `This is recorded in the run log; please justify it in the PR.`);
              await publish('neutral', `Bypassed via '${overrideLabel}'`,
                `The \`${overrideLabel}\` label is set, so ownership was not ` +
                `checked. Please justify the bypass in the PR.`);
              return;
            }

            // Latest decisive review per user. COMMENTED reviews are skipped:
            // they do not change an existing approval on GitHub either.
            const reviews = await github.paginate(
              github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number });
            const latest = new Map();
            for (const r of reviews) {
              if (r.state === 'COMMENTED' || !r.user) continue;
              latest.set(r.user.login.toLowerCase(), r);
            }

            // lowercased login -> { login (as GitHub spells it), stale }.
            // Self-approvals are ignored: counting one would let a PR satisfy
            // its own gate.
            const approvals = new Map();
            for (const [login, r] of latest) {
              if (r.state !== 'APPROVED' || login === author) continue;
              approvals.set(login,
                { login: r.user.login, stale: r.commit_id !== headSha });
            }

            const at = list => list.map(h => '@' + h).join(', ');
            const rows = [];
            const blocked = [];
            const staleNotes = [];

            for (const group of groups) {
              // Compared lowercased, displayed as CODEOWNERS spells them so
              // the output stays copy-pasteable.
              const owners = group.owners.map(o => o.replace(/^@/, ''));
              const eligible = owners.filter(o => o.toLowerCase() !== author);
              const soleOwner = eligible.length === 0;

              // If the author owns the area outright, no codeowner can satisfy
              // it, so accept any approval rather than deadlocking the PR.
              const candidates = soleOwner
                ? [...approvals.keys()]
                : eligible.map(o => o.toLowerCase());
              const matched = candidates
                .filter(o => approvals.has(o))
                .map(o => approvals.get(o));
              const accepted = strict ? matched.filter(a => !a.stale) : matched;
              const stale = matched.filter(a => a.stale);
              const ok = accepted.length > 0;

              const wanted = soleOwner ? 'anyone' : at(eligible);

              if (stale.length) {
                staleNotes.push(
                  `${group.pattern}: approval from ` +
                  `${at(stale.map(a => a.login))} predates the current head ` +
                  `commit (${headSha.slice(0, 8)})`);
              }
              if (!ok) {
                blocked.push(soleOwner
                  ? `${group.pattern} -- you are its only owner, so any ` +
                    `approval will do`
                  : `${group.pattern} -- needs an approval from ${wanted}`);
              }

              rows.push([
                group.pattern,
                ok ? '✅ ' + at(accepted.map(a => a.login)) : '❌',
                wanted,
                String(group.files.length),
              ]);
            }

            await core.summary
              .addHeading('Approval Gate', 2)
              .addTable([
                [{ data: 'Area', header: true }, { data: 'Approved by', header: true },
                 { data: 'Owners', header: true }, { data: 'Files', header: true }],
                ...rows,
              ])
              .write();

            for (const note of staleNotes) core.warning(note);

            if (!groups.length) {
              await publish('neutral', 'Nothing to gate',
                'No CODEOWNERS rule matches the files in this PR.');
              return;
            }

            // The same table as markdown, so the detail is on the check run
            // and not only on the workflow run's summary page.
            const table = [
              '| Area | Approved by | Owners | Files |',
              '| --- | --- | --- | --- |',
              ...rows.map(r => `| ${r.join(' | ')} |`),
            ].join('\n');
            const notes = staleNotes.length
              ? '\n\n**Stale approvals** (counted, but predating the current ' +
                `head):\n\n- ${staleNotes.join('\n- ')}`
              : '';

            if (blocked.length) {
              const title = `Missing approval for ${blocked.length} of ` +
                `${groups.length} area(s)`;
              await publish(missingConclusion, title,
                `Every area a PR touches needs an approval from one of its ` +
                `owners.\n\n- ${blocked.join('\n- ')}\n\n${table}${notes}\n\n` +
                `\`scripts/find_owners.py --request\` asks exactly these ` +
                `people.`);
              return;
            }
            await publish('success', `All ${groups.length} area(s) approved`,
              `${table}${notes}`);
