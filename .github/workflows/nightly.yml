# CI - Nightly Build
#
# This workflow builds the `torchtpu-vllm` package (wheel and sdist), runs the test suite
# on a TPU v7 VM, and uploads the artifacts to GCS and Artifact Registry.
#
# Triggers:
#   - Manual dispatch (workflow_dispatch) with optional version override and wait-for-connection.
#   - Scheduled: Daily at 8 AM UTC (12 AM PST).
#
# Upload Locations:
#   - GCS: `gs://torch-tpu-vllm-ci-transient/artifacts/CI - Nightly Build/<run_number>/<run_attempt>/`
#     (Uploaded on every run, transient, used by the test job).
#   - Artifact Registry: `https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-vllm-testing-registry/`
#     (Uploaded ONLY for scheduled runs on the `main` branch).
#
# Local Installation of Nightlies:
#   To install the nightly builds locally, point `pip` or `uv` to the testing registry.
#   You must be authenticated to access the `ml-oss-artifacts-transient` registry (see README.md section 1).
#
#   Using `uv`:
#   ```bash
#   uv pip install --pre --extra-index-url https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-vllm-testing-registry/simple/ vllm_torchtpu
#   ```
#
#   Using `pip`:
#   ```bash
#   pip install --pre --extra-index-url https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-vllm-testing-registry/simple/ vllm_torchtpu
#   ```
name: CI - Nightly Build

on:
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
      VERSION:
        description: 'Use this to override the torchtpu-vllm version'
        type: string
        default: ''
  schedule:
      - cron: '0 8 * * *' # 8 AM UTC / 12 AM PST

permissions:
  contents: read

jobs:
  build:
    if: false && github.repository == 'vllm-project/vllm-torchtpu'
    defaults:
      run:
        shell: bash

    runs-on: linux-x86-n4-16
    container: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    outputs:
      gcs_path: ${{ steps.upload-to-gcs.outputs.gcs_path }}
    name: Build wheel

    env:
      # Enable color in logs
      FORCE_COLOR: "1"

    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
    - name: Mark git directory as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Determine Version
      env:
        GH_EVENT_NAME: ${{ github.event_name }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_REF: ${{ github.ref }}
      run: bash .github/scripts/determine_release_vars.sh
    # Halt for testing
    - name: Wait For Connection
      uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
      with:
        halt-dispatch-input: ${{ inputs.halt-for-connection }}
    - name: Build package (sdist and wheel)
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.VERSION || inputs.VERSION }}
      run: python3 -m build
    - name: Upload to GCS
      id: upload-to-gcs
      run: |
        # Upload to GCS
        gcloud storage cp -r "dist/*.whl" "gs://torch-tpu-vllm-ci-transient/artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}/"
        gcloud storage cp -r "dist/*.tar.gz" "gs://torch-tpu-vllm-ci-transient/artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}/"

        echo "gcs_path=gs://torch-tpu-vllm-ci-transient/artifacts/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
    - name: Upload artifacts to Artifact Registry
      # Upload to artifact registry only if it's scheduled run on the main branch
      if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
      run: |
        # Install package needed to authenticate to artifactregistry for Python.
        # See https://cloud.google.com/artifact-registry/docs/python/authentication
        uv pip install --system keyrings.google-artifactregistry-auth

        # Configure pypirc for twine upload.
        pypirc_content=$(cat <<EOF
        [distutils]
        index-servers =
            torch-tpu-vllm-testing-repo

        [torch-tpu-vllm-testing-repo]
        repository = https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-vllm-testing-registry/
        EOF
        )
        echo "$pypirc_content" > "$HOME"/.pypirc

        # Upload to Artifact registry
        python3 -m twine upload --repository-url https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-vllm-testing-registry dist/*.whl
        python3 -m twine upload --repository-url https://us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-vllm-testing-registry dist/*.tar.gz

  run-tests:
    if: false && github.repository == 'vllm-project/vllm-torchtpu'
    needs: build
    uses: ./.github/workflows/tests.yml
    name: "Run Tests"
    with:
      halt-for-connection: ${{ inputs.halt-for-connection }}
      wheel-gcs-path: ${{ needs.build.outputs.gcs_path }}
      nightly: 'yes'
