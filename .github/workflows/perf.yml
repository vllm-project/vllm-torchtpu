# isolation (each `vllm serve` gets a clean TPU device + container)
# without duplicating YAML across 4 separate workflow files.
#
# Do NOT collapse the matrix back into a bash `for cfg in ...` loop in
# a single job: running multiple vllm serve invocations sequentially in
# one container has historically caused the 2nd config's server to
# never reach ready (suspected libtpu / device-handle state leak across
# pkill -9 cleanup).

name: CI - Perf and Eval on TPU

on:
  workflow_call:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: string
        default: 'no'

  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
          - 'yes'
          - 'no'
  schedule:
    - cron: '0 10 * * *' # 10 AM UTC, after nightly build

permissions:
  contents: read
  pull-requests: read
  issues: read

# No `concurrency` block here: this runs as a reusable workflow from
# presubmit-tpu.yml, where `github.workflow` resolves to the caller. A group
# would match the caller's and deadlock the reusable run, so the caller owns
# concurrency (matching tests.yml).

jobs:
  check_changes:
    if: github.repository == 'google-pytorch/torchtpu-vllm' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            src:
              - '!**.md'
              - '!docs/**'
              - '!docker/**'
              - '!.gitignore'
              - '!.dockerignore'
              - '!.pre-commit-config.yaml'
              - '!.readthedocs.yaml'
              - '!mkdocs.yml'
              - '!LICENSE'
              - '!DCO'
              - '!MANIFEST.in'

  # Combined Perf and Eval job using matrix and run_on filtering.
  perf-eval:
    name: "Perf and Eval (${{ matrix.config.name }})"
    needs: check_changes
    if: |
      github.repository == 'google-pytorch/torchtpu-vllm' &&
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'pull_request' && needs.check_changes.outputs.should_run == 'true')
      )
    runs-on: linux-x86-tpu7x-224-4tpu
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-transient/torch-tpu-docker-container/torchtpu-vllm-ci:latest
      options: --privileged --net=host --shm-size=16g --device /dev/fuse
      env:
        HF_HOME: /local_hf_cache
        SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        UV_INDEX_TORCH_TPU_REGISTRY_USERNAME: oauth2accesstoken
    timeout-minutes: 360

    env:
      FORCE_COLOR: "1"
      UV_NO_CACHE: "1"
      TQDM_MININTERVAL: "30"

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: qwen3-coder-30b-tp8-ep
            gs_path: gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3-Coder-30B-A3B-Instruct/
            run_on: ["pr"]
            type: guard
            retention: 14
          - name: qwen3-coder-30b-fp8-tp8-ep
            gs_path: gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3-Coder-30B-A3B-Instruct-FP8/
            run_on: ["pr"]
            type: guard
            retention: 14
          - name: qwen3.5-35b-fp8-tp4-ep
            gs_path: gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3.5-35B-A3B-FP8/
            run_on: ["pr"]
            type: guard
            retention: 14
          - name: qwen3-0.6b-tp1
            gs_path: gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3-0.6B/
            run_on: ["pr"]
            type: guard
            retention: 14
          - name: qwen3-coder-480b-fp8-tp8-ep
            gs_path: gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3-Coder-480B-A35B-Instruct-FP8/
            run_on: ["nightly"]
            type: nightly
            retention: 30
          - name: qwen3.5-397b-fp8-tp8-ep
            gs_path: gs://tpu-inference-hf-llm-model-checkpoints/models--Qwen--Qwen3.5-397B-A17B-FP8/
            run_on: ["nightly"]
            type: nightly
            retention: 30

    steps:
      - name: Decide if to run
        id: decide
        shell: bash
        run: |
          RUN=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RUN=true
          elif [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "${{ contains(matrix.config.run_on, 'pr') }}" == "true" ]]; then
            RUN=true
          elif [[ "${{ github.event_name }}" == "schedule" ]] && [[ "${{ contains(matrix.config.run_on, 'nightly') }}" == "true" ]]; then
            RUN=true
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Decision for ${{ matrix.config.name }}: $RUN"

      - name: Redirect torch_tpu cache off /dev/shm
        if: steps.decide.outputs.run == 'true'
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        if: steps.decide.outputs.run == 'true'

      - name: Mark git directory as safe
        if: steps.decide.outputs.run == 'true'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup uv
        if: steps.decide.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Save installed packages list
        if: steps.decide.outputs.run == 'true'
        run: uv pip list > /tmp/perf_eval_pip_list.txt

      - name: Wait For Connection
        if: steps.decide.outputs.run == 'true'
        uses: google-ml-infra/actions/ci_connection@9f8d7d8d9954430d0fef4a8cce2cb4e3844c200d
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}

      - name: Setup Virtual Environment
        if: steps.decide.outputs.run == 'true'
        run: |
          uv venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Keyring for Auth
        if: steps.decide.outputs.run == 'true'
        run: |
          uv pip install --no-config --index-url https://pypi.org/simple keyring keyrings.google-artifactregistry-auth
          echo UV_INDEX_TORCH_TPU_REGISTRY_USERNAME="oauth2accesstoken" >> "$GITHUB_ENV"

      - name: Install crc32c for gsutil
        if: steps.decide.outputs.run == 'true'
        run: uv pip install --system crc32c

      - name: Copy model to local cache
        if: steps.decide.outputs.run == 'true'
        run: |
          mkdir -p /local_hf_cache/hub
          gsutil -m cp -r ${{ matrix.config.gs_path }} /local_hf_cache/hub/

      - name: Run perf and eval
        if: steps.decide.outputs.run == 'true'
        shell: bash
        env:
          MODEL_IMPL_TYPE: vllm
        run: |
          uv pip install ".[test,benchmarking]"
          if [[ "${{ matrix.config.type }}" == "nightly" ]]; then
            export EVALPLUS_DATASETS="humaneval mbpp"
            export EVALPLUS_PARALLEL="8"
            bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config ${{ matrix.config.name }} --run-lm-eval --run-evalplus
          else
            export BENCHMARK_WARMUP_RUNS="1"
            bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config ${{ matrix.config.name }} --run-lm-eval
          fi

      - name: Stage artifacts for upload
        if: always() && steps.decide.outputs.run == 'true'
        run: |
          mkdir -p perf_eval_results
          cp -r /tmp/perf_eval_* perf_eval_results/ || true

      - name: Upload JSON results
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: perf-eval-${{ matrix.config.type }}-results-${{ matrix.config.name }}
          path: perf_eval_results/
          retention-days: ${{ matrix.config.retention }}
          if-no-files-found: warn
