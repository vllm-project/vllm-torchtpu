pull_request_rules:
  - name: label-bug
    conditions:
      - -closed
      - or:
          - 'title~=(?i)\[bug(?:fix)?\]'
          - 'body~=(?im)^[ \t]*[-*][ \t]+\[x\][ \t]+(?:`?\[bugfix\]`?|bug[ \t]+fix(?:es)?\b)'
    actions:
      label:
        add: [bug]

  - name: label-documentation
    conditions:
      - -closed
      - or:
          - 'title~=(?i)\[(?:docs?|documentation)\]'
          - 'body~=(?im)^[ \t]*[-*][ \t]+\[x\][ \t]+(?:`?\[docs?\]`?|documentation\b)'
          - and:
              - 'files~=(?i)^(?:docs/|CONTRIBUTING\.md$|(?:.*/)?README(?:\.[^/]+)?$)'
              - '-files~=(?i)^(?!docs/|CONTRIBUTING\.md$|(?:.*/)?README(?:\.[^/]+)?$)'
    actions:
      label:
        add: [documentation]

  - name: label-model-support
    conditions:
      - -closed
      - or:
          - 'title~=(?i)\[(?:model(?:[ -]+support)?|new[ -]+model)\]'
          - 'body~=(?im)^[ \t]*[-*][ \t]+\[x\][ \t]+(?:`?\[model\]`?|model[ \t]+support\b)'
    actions:
      label:
        add: [model-support]
