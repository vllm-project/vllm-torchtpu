# Kimi-K3 1P1D: prefill and decode each TP8 x DP4 x EP32 on their own 2x2x4 slice,
# one DP replica per host, KV over Raiden, the proxy and tasks on the prefill head.
schema: 1
name: kimi-k3-tp8-dp4-ep-1p1d
extends: kimi-k3/tp32-ep
server:
  accelerator: null
  topology: null
  hosts: null
  chips_per_host: null
  multihost: mp
  scratch: 64Gi
  args:
    tensor-parallel-size: 8
    data-parallel-size: 4
    gpu-memory-utilization: 0.80
    enable-prefix-caching: true
    max-num-batched-tokens: 1296
    compilation-config:
      compile_sizes: [1, 8, 1296]
    distributed-executor-backend: mp
  env:
    TPU_KV_RESHARD_TRANSPORT: raiden
    TPU_RAIDEN_DST_SHARDS: "8"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "10800"
  roles:
    prefill:
      accelerator: tpu7x
      topology: 2x2x4
      hosts: 4
      chips_per_host: 4
      kv:
        connector: TPURaidenConnector
        role: producer
    decode:
      accelerator: tpu7x
      topology: 2x2x4
      hosts: 4
      chips_per_host: 4
      kv:
        connector: TPURaidenConnector
        role: consumer
  router:
    type: toy-proxy
    command: [python3, examples/disagg/toy_proxy_server.py]
tasks:
  driver: prefill
  perf: null
  custom:
    - name: correctness
      command: [bash, scripts/vllm/integration/run_k3_1p1d_disagg_correctness.sh]
      env:
        PREFILL_CHUNK_TOKENS: "1296"
        K3_PD_DP_RANK: "3"
        LOG_DIR: "${SCENARIO_RESULTS_DIR}/k3_1p1d_correctness"
      timeout: 4h
      skip_rest_if_exit_ge: 2
  eval:
    baseline:
      from: kimi-k3/tp32-ep
