# Unit-test line-coverage measurement, including engine subprocess coverage
# (see .coveragerc). Runs the same test selection as CI's unit-test jobs on a
# 1-chip and a 4-chip v7x slice, then combines the data and reports.
#
# Uploaded by a dedicated coverage Buildkite pipeline; run on demand.
#
# NOTES
# ─────
# * The TPU steps write their data under ARTIFACTS_DIR, which run.sh uploads
#   from the pod as the step's artifacts. Keep the data files out of dotfile
#   names: the upload globs '**/*'.
# * The combine step runs on a cpu agent outside docker; it installs
#   coverage with pip --user because those agents lack python3-venv.

steps:

  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: "coverage: 2-chip (not multichip)"
    key: cov_2chip
    depends_on: build_docker
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    timeout_in_minutes: 330
    env:
      SHAPE: "tpu7x-standard-1t/1x1x1"
      ARTIFACTS_DIR: "perf_eval_results"
    commands:
      - |
        .buildkite/kubernetes/run.sh bash -c '
          test -f .coveragerc || { echo "[coverage] .coveragerc missing in the image; branch/parallel/subprocess settings would be silently dropped"; exit 1; };
          COVERAGE_FILE=perf_eval_results/coverage_2chip.dat \
          python3 -m pytest -q --timeout=1800 -m "not nightly and not multichip" \
            --cov=vllm_torchtpu --cov-report= tests/ || true;
          ls -la perf_eval_results/'

  - label: "coverage: 8-chip (multichip)"
    key: cov_8chip
    depends_on: build_docker
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    timeout_in_minutes: 330
    env:
      SHAPE: "tpu7x-standard-4t/2x2x1"
      ARTIFACTS_DIR: "perf_eval_results"
    commands:
      - |
        .buildkite/kubernetes/run.sh bash -c '
          test -f .coveragerc || { echo "[coverage] .coveragerc missing in the image; branch/parallel/subprocess settings would be silently dropped"; exit 1; };
          COVERAGE_FILE=perf_eval_results/coverage_8chip.dat \
          python3 -m pytest -q --timeout=3600 -m "not nightly and multichip" \
            --cov=vllm_torchtpu --cov-report= tests/ || true;
          ls -la perf_eval_results/'

  - label: "coverage: combine + report"
    key: cov_combine
    depends_on:
      - cov_2chip
      - cov_8chip
    agents:
      queue: cpu
    timeout_in_minutes: 30
    commands:
      - buildkite-agent artifact download "perf_eval_results/coverage_*" .
      - ls -la perf_eval_results/
      - python3 -m pip install -q --break-system-packages --user coverage
      - python3 -m coverage combine perf_eval_results/coverage_*chip.dat*
      - python3 -m coverage report | tee coverage_summary.txt
      - python3 -m coverage xml -o coverage.xml
      - python3 -m coverage html -d cov_html
    artifact_paths:
      - "coverage_summary.txt"
      - "coverage.xml"
      - "cov_html/**/*"
