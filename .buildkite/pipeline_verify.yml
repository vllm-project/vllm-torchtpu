# The verify lane on the Kueue fleet: the steps in models/*.yml, uploaded with
# each TPU generation's pod shapes by upload_models_and_features.sh, their
# record steps, and the nightly report. The report runs on the cpu queue,
# whose agents hold the GitHub App credentials its pushes use, and pushes
# nothing until the kube nightly's schedule sets KUBE_OWNS_NIGHTLY=1.

steps:
  - label: "Support matrices and verified commit"
    if: 'build.env("NIGHTLY") == "1" || build.tag =~ /^v?[0-9]+(\.[a-zA-Z0-9]+)*([a-zA-Z]+[0-9]*)?$/'
    key: "nightly_report"
    # Dynamically uploaded by upload_models_and_features.sh; stage-level
    # dependencies on precheck and tpu are added by render_pipeline.py.
    depends_on:
      - "v6e-group"
      - "v7x-group"
    allow_dependency_failure: true
    agents:
      queue: cpu
    commands:
      - bash .buildkite/scripts/nightly_report.sh
