x-unit-test-defaults: &unit_test_defaults
  commands:
    - bash .buildkite/scripts/run_in_docker.sh bktec run || [ $? -eq 5 ]

x-cpu-unit-test-defaults: &cpu_unit_test_defaults
  depends_on: "build_docker"
  commands:
    - bash .buildkite/scripts/run_in_docker.sh bktec run
  agents:
    queue: "cpu_64_core"
  env:
    CPU_ONLY: "1"

x-tests-plugin-defaults: &tests_plugin_defaults
  # Resolved relative to the Buildkite org running the build.
  suite-slug: tpu-ci
  test-runner: pytest
  test-file-pattern: "tests/**/{test_*,*_test}.py"
  install-client: false
  oidc-lifetime: 7200

steps:
  - label: "Type Check - Full Environment"
    key: "typecheck_full"
    depends_on: "build_docker"
    agents:
      queue: "cpu"
    env:
      CPU_ONLY: "1"
    commands:
      # Runs pyrefly inside the CI image, where torch, jax and vllm resolve,
      # against .pyrefly-baseline-full.json. The pre-commit hook checks the
      # same code with those packages unresolved and cannot see errors at
      # that boundary.
      - bash .buildkite/scripts/run_in_docker.sh bash tools/typecheck_full.sh

  - label: "Unit Tests - CPU (PR)"
    key: "unit_tests_cpu_pr"
    <<: *cpu_unit_test_defaults
    if: 'build.env("NIGHTLY") != "1"'
    plugins:
      - tests#v1.0.0:
          <<: *tests_plugin_defaults
          test-file-pattern: "tests/**/{test_*,*_test}.py"
          fail-on-no-tests: true
          # glm-agentx exclusions (bootstrap.sh); the default names no test file.
          test-file-exclude-pattern: "${UNIT_TEST_EXCLUDE_CPU:-tests/conftest.py}"
          test-cmd: "pytest -sv --timeout=600 -m 'not tpu_test and not multichip and not nightly' --junit-xml={{resultPath}} {{testExamples}}"

  - label: "Unit Tests - CPU (Nightly)"
    key: "unit_tests_cpu_nightly"
    <<: *cpu_unit_test_defaults
    if: 'build.env("NIGHTLY") == "1"'
    plugins:
      - tests#v1.0.0:
          <<: *tests_plugin_defaults
          test-file-pattern: "tests/**/{test_*,*_test}.py"
          fail-on-no-tests: true
          # glm-agentx exclusions (bootstrap.sh); the default names no test file.
          test-file-exclude-pattern: "${UNIT_TEST_EXCLUDE_CPU:-tests/conftest.py}"
          test-cmd: "pytest -sv --timeout=600 -m 'not tpu_test and not multichip' --junit-xml={{resultPath}} {{testExamples}}"

  - group: "Unit Tests on TPU"
    depends_on: "build_docker"
    steps:
      # test_speculative_decoding.py gets its own PR steps, mirroring the
      # nightly pair below, so spec-decode results are visible as their own
      # step rather than buried in the general run and so the suite runs on
      # its own agents instead of serializing behind everything else. The
      # general steps exclude the file to avoid running it twice.
      #
      # bktec splits General by file, not by example, so a file that shares
      # one engine across its tests (module-scoped fixtures, the Qwen2.5-VL
      # engines in test_multi_modal_inference.py) starts it in one shard only.
      - label: "Unit Tests - General (PR)"
        key: "unit_tests_general_pr"
        <<: *unit_test_defaults
        if: 'build.env("NIGHTLY") != "1"'
        parallelism: 3
        agents:
          queue: "tpu_v7x_2_queue"
        plugins:
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "${UNIT_TEST_EXCLUDE_TPU:-tests/entrypoints/llm/test_speculative_decoding.py}"
              test-cmd: "pytest -sv --timeout=600 -m 'tpu_test and not nightly and not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "Unit Tests - Multichip (PR)"
        key: "unit_tests_multichip_pr"
        <<: *unit_test_defaults
        if: 'build.env("NIGHTLY") != "1"'
        agents:
          queue: "tpu_v7x_8_queue"
        plugins:
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "${UNIT_TEST_EXCLUDE_TPU:-tests/entrypoints/llm/test_speculative_decoding.py}"
              test-cmd: "pytest -sv --timeout=600 -m 'not nightly and multichip' --junit-xml={{resultPath}} {{testExamples}}"

      # Representative correctness cases run on PRs; the full parameter
      # matrix and acceptance-rate tests run nightly. Split by example because
      # the suite is a single file. bktec balances using recorded test durations.
      - label: "Unit Tests - Speculative Decoding (PR)"
        key: "unit_tests_spec_decode_pr"
        <<: *unit_test_defaults
        if: 'build.env("NIGHTLY") != "1"'
        parallelism: 3
        env:
          # bktec enumerates the examples to split with a plain
          # `pytest --collect-only`, which does not see the `-m` filter in
          # test-cmd. Without this the nightly-only cases would be handed
          # to the splitter carrying their (long) nightly timings and then
          # deselected at run time, so a shard could be planned full and
          # actually run almost nothing. PYTEST_ADDOPTS applies to collection
          # as well as to the run, which keeps the split over what PR
          # actually executes. run_in_docker.sh forwards it into the container.
          PYTEST_ADDOPTS: "-m 'not nightly and not multichip'"
        agents:
          queue: "tpu_v7x_2_queue"
        plugins:
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              split-by-example: true
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=1800 -m 'not nightly and not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "Unit Tests - Speculative Decoding Multichip (PR)"
        key: "unit_tests_spec_decode_multichip_pr"
        <<: *unit_test_defaults
        if: 'build.env("NIGHTLY") != "1"'
        agents:
          queue: "tpu_v7x_8_queue"
        artifact_paths:
          - "perf_eval_results/**/*"
        plugins:
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=3600 -m 'not nightly and multichip' --junit-xml={{resultPath}} {{testExamples}}"

      # Omni multimodal and diffusion models on TPU.
      - label: "Unit Tests - Omni (PR)"
        key: "unit_tests_omni_pr"
        skip: "${GLM_AGENTX_SKIP:-}"
        <<: *unit_test_defaults
        depends_on: "build_docker_omni"
        if: 'build.env("NIGHTLY") != "1"'
        commands:
          - "bash .buildkite/scripts/stage_model_snapshot.sh gs://tpu-commons-ci/models--black-forest-labs--FLUX.1-schnell/"
          - "bash .buildkite/scripts/stage_model_snapshot.sh gs://tpu-commons-ci/golden/ /mnt/disks/persist/models"
          - "bash .buildkite/scripts/run_in_docker.sh bktec run"
        env:
          DOCKER_IMAGE_SUFFIX: "-omni"
        agents:
          queue: "tpu_v7x_2_queue"
        plugins:
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests_omni/**/{test_*,*_test}.py"
              fail-on-no-tests: true
              test-cmd: "pytest -sv --timeout=1200 -m 'not nightly and omni' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "Unit Tests - Speculative Decoding (Nightly)"
        key: "unit_tests_spec_decode_nightly"
        <<: *unit_test_defaults
        if: 'build.env("NIGHTLY") == "1"'
        parallelism: 3
        env:
          PYTEST_ADDOPTS: "-m 'not multichip'"
        agents:
          queue: "tpu_v7x_2_queue"
        plugins:
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              split-by-example: true
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      # The data-parallel MTP tests in the same file need DP*TP chips, which
      # the 2-chip spec-decode queue above cannot provide (they self-skip
      # there). This step is the only place they get enough chips to run.
      - label: "Unit Tests - Speculative Decoding Multichip (Nightly)"
        key: "unit_tests_spec_decode_multichip_nightly"
        <<: *unit_test_defaults
        if: 'build.env("NIGHTLY") == "1"'
        agents:
          queue: "tpu_v7x_8_queue"
        artifact_paths:
          - "perf_eval_results/**/*"
        plugins:
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=3600 -m 'multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "Unit Tests - General (Nightly)"
        key: "unit_tests_general_nightly"
        <<: *unit_test_defaults
        if: 'build.env("NIGHTLY") == "1"'
        agents:
          queue: "tpu_v7x_2_queue"
        plugins:
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "${UNIT_TEST_EXCLUDE_TPU:-tests/entrypoints/llm/test_speculative_decoding.py}"
              test-cmd: "pytest -sv --timeout=600 -m 'tpu_test and not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "Unit Tests - Multichip (Nightly)"
        key: "unit_tests_multichip_nightly"
        <<: *unit_test_defaults
        if: 'build.env("NIGHTLY") == "1"'
        agents:
          queue: "tpu_v7x_8_queue"
        plugins:
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "${UNIT_TEST_EXCLUDE_TPU:-tests/entrypoints/llm/test_speculative_decoding.py}"
              test-cmd: "pytest -sv --timeout=600 -m 'multichip' --junit-xml={{resultPath}} {{testExamples}}"

      # Omni multimodal and diffusion models on TPU.
      - label: "Unit Tests - Omni (Nightly)"
        key: "unit_tests_omni_nightly"
        skip: "${GLM_AGENTX_SKIP:-}"
        <<: *unit_test_defaults
        depends_on: "build_docker_omni"
        if: 'build.env("NIGHTLY") == "1"'
        commands:
          - "bash .buildkite/scripts/stage_model_snapshot.sh gs://tpu-commons-ci/models--black-forest-labs--FLUX.1-schnell/"
          - "bash .buildkite/scripts/stage_model_snapshot.sh gs://tpu-commons-ci/golden/ /mnt/disks/persist/models"
          - "bash .buildkite/scripts/run_in_docker.sh bktec run"
        env:
          DOCKER_IMAGE_SUFFIX: "-omni"
        agents:
          queue: "tpu_v7x_2_queue"
        plugins:
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests_omni/**/{test_*,*_test}.py"
              fail-on-no-tests: true
              test-cmd: "pytest -sv --timeout=1800 -m 'nightly and omni' --junit-xml={{resultPath}} {{testExamples}}"
