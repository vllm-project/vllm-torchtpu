# The TPU unit test suite on the Kueue fleet; bootstrap.py uploads it with the
# image build from pipeline_build.yml (CPU checks live in pipeline_cpu.yml).
# It goes up once per TPU generation, v6e and v7x side
# by side, with the same steps and tests on each: TPU_GENERATION_FILES in
# bootstrap.py fills in the generation's name, which the group name and every
# label start with, its shapes, its key prefix and soft_fail.

# The `tests` plugin runs on the agent and exports BUILDKITE_TEST_ENGINE_*;
# bktec runs in the pod, and run.sh forwards that configuration across - see
# common.sh for what happens to the credentials.

# Carries the launcher and the service account that may submit a workload.
# Repeated per step rather than merged in, because a step's `plugins:` is a list
# and a YAML merge key replaces it wholesale.
x-kube-plugin: &kube_plugin
  kubernetes:
    podTemplate: tpu-launcher

x-tpu-step-defaults: &tpu_step
  depends_on: "build_docker"
  # Covers queueing too: the agent pod starts at once and waits inside the
  # step, so this is the launcher's whole budget, not a test's length.
  timeout_in_minutes: 1440
  # "true" for a generation whose failures should not fail the build yet. A
  # string, as interpolation leaves it; Buildkite takes "true" and "false".
  soft_fail: "${TPU_SOFT_FAIL:-false}"
  agents:
    queue: "kube"
  commands:
    # Exit 5 is pytest's "no tests collected", which a shard can legitimately
    # reach once the marker filter has emptied it. Tolerated inside the pod
    # because the launcher reports a workload as 0 or 1, so a 5 never survives
    # to be compared out here.
    - .buildkite/kubernetes/run.sh bash -c 'bktec run || [ $$? -eq 5 ]'

x-tests-plugin-defaults: &tests_plugin_defaults
  suite-slug: "${TPU_TEST_SUITE:-tpu-ci}"
  test-runner: pytest
  test-file-pattern: "tests/**/{test_*,*_test}.py"
  install-client: false
  oidc-lifetime: 7200

# The generation's shapes, from bootstrap.py; the defaults are v7x's, for an
# upload of this file on its own. One chip is two devices on v7x (two
# TensorCores) and one on v6e; v6e steps soft-fail while remaining v7x-assumed
# tests are audited and skipped or adapted on v6e.
x-shape-single: &shape_single "${KUBE_SHAPE_SINGLE:-tpu7x-standard-1t/1x1x1}"
x-shape-multi: &shape_multi "${KUBE_SHAPE_MULTI:-tpu7x-standard-4t/2x2x1}"

steps:
  - group: "Unit Tests on TPU ${TPU_GENERATION:-v7x}"
    steps:
      # test_speculative_decoding.py gets steps of its own so it runs on its
      # own chips rather than serializing behind everything else; the general
      # steps exclude the file so it is not run twice.
      #
      # Split by file, not by example, so a file that shares one engine
      # across its tests starts it in one shard only.
      - label: "${TPU_GENERATION:-v7x} Unit Tests - General (PR)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_general_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        parallelism: 3
        env:
          SHAPE: *shape_single
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'tpu_test and not nightly and not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "${TPU_GENERATION:-v7x} Unit Tests - Multichip (PR)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_multichip_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        env:
          SHAPE: *shape_multi
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'not nightly and multichip' --junit-xml={{resultPath}} {{testExamples}}"

      # Representative correctness cases run on PRs; the full parameter matrix
      # and acceptance-rate tests run nightly. Split by example because the
      # suite is a single file.
      - label: "${TPU_GENERATION:-v7x} Unit Tests - Speculative Decoding (PR)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_spec_decode_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        parallelism: 3
        env:
          SHAPE: *shape_single
          # bktec splits over a plain `pytest --collect-only`, which does not
          # see the `-m` filter in test-cmd, so without this the nightly-only
          # cases are planned into shards carrying their long timings and then
          # deselected at run time. PYTEST_ADDOPTS applies to collection too.
          PYTEST_ADDOPTS: "-m 'not nightly and not multichip'"
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              split-by-example: true
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=1800 -m 'not nightly and not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "${TPU_GENERATION:-v7x} Unit Tests - Speculative Decoding Multichip (PR)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_spec_decode_multichip_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        env:
          SHAPE: *shape_multi
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=3600 -m 'not nightly and multichip' --junit-xml={{resultPath}} {{testExamples}}"

      # Omni multimodal and diffusion models, on the -omni image. The FLUX and
      # Qwen tests compare against golden files under $HF_HOME/golden; only
      # $HF_HOME/hub is the shared cache, so the pod stages golden/ from the
      # bucket. The weights come through the shared cache, downloaded by the
      # first run that needs them.
      - label: "${TPU_GENERATION:-v7x} Unit Tests - Omni (PR)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_omni_pr"
        <<: *tpu_step
        depends_on: "build_docker_omni"
        if: 'build.env("NIGHTLY") != "1"'
        env:
          SHAPE: *shape_single
          DOCKER_IMAGE_SUFFIX: "-omni"
        commands:
          - &omni_test |
            .buildkite/kubernetes/run.sh bash -c '
              bash .buildkite/scripts/stage_model_snapshot.sh gs://tpu-commons-ci/golden/ "$$HF_HOME" &&
              bktec run'
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests_omni/**/{test_*,*_test}.py"
              fail-on-no-tests: true
              test-cmd: "pytest -sv --timeout=1200 -m 'not nightly' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "${TPU_GENERATION:-v7x} Unit Tests - Speculative Decoding (Nightly)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_spec_decode_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        parallelism: 3
        env:
          SHAPE: *shape_single
          PYTEST_ADDOPTS: "-m 'not multichip'"
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              split-by-example: true
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      # The data-parallel MTP tests in the same file need DP*TP chips and
      # self-skip on the one-chip shape above, so this step is the only place
      # they run.
      - label: "${TPU_GENERATION:-v7x} Unit Tests - Speculative Decoding Multichip (Nightly)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_spec_decode_multichip_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        env:
          SHAPE: *shape_multi
          # The DSv4 DSpark tests compile DeepSeek-V4 on eight ranks, and the
          # saved artifacts reach ~70 GB within minutes. On the pod's ephemeral
          # storage that gets the pod evicted, and the Job reruns the whole file
          # until the launcher's deadline. The caches go to the compilation
          # bucket, as in the DSv4 manifests, and the inductor scratch to shm.
          VLLM_CACHE_ROOT: "/cache/jax/vllm"
          VLLM_XLA_CACHE_PATH: "/cache/jax/xla"
          TMPDIR: "/dev/shm"
          RAY_TMPDIR: "/tmp"
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=3600 -m 'multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "${TPU_GENERATION:-v7x} Unit Tests - General (Nightly)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_general_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        parallelism: 3
        env:
          SHAPE: *shape_single
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'tpu_test and not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "${TPU_GENERATION:-v7x} Unit Tests - Multichip (Nightly)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_multichip_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        env:
          SHAPE: *shape_multi
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"
              test-cmd: "pytest -sv --timeout=600 -m 'multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "${TPU_GENERATION:-v7x} Unit Tests - Omni (Nightly)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_omni_nightly"
        <<: *tpu_step
        depends_on: "build_docker_omni"
        if: 'build.env("NIGHTLY") == "1"'
        env:
          SHAPE: *shape_single
          DOCKER_IMAGE_SUFFIX: "-omni"
        commands:
          - *omni_test
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests_omni/**/{test_*,*_test}.py"
              fail-on-no-tests: true
              test-cmd: "pytest -sv --timeout=1800 -m 'not multichip' --junit-xml={{resultPath}} {{testExamples}}"

      - label: "${TPU_GENERATION:-v7x} Unit Tests - Omni Multichip (Nightly)"
        key: "${TPU_KEY_PREFIX:-}unit_tests_omni_multichip_nightly"
        <<: *tpu_step
        depends_on: "build_docker_omni"
        if: 'build.env("NIGHTLY") == "1"'
        env:
          SHAPE: *shape_multi
          DOCKER_IMAGE_SUFFIX: "-omni"
        commands:
          - *omni_test
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests_omni/**/{test_*,*_test}.py"
              fail-on-no-tests: true
              test-cmd: "pytest -sv --timeout=1800 -m 'multichip' --junit-xml={{resultPath}} {{testExamples}}"
