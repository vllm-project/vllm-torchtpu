steps:
  - group: "Unit Tests on TPU"
    depends_on: "build_docker"
    steps:
      - label: "Unit Tests - Speculative Decoding (PR)"
        key: "unit_tests_spec_decode_pr"
        if: 'build.env("NIGHTLY") != "1"'
        agents:
          queue: "tpu_v7x_2_queue"
        env:
          MODEL_IMPL_TYPE: "vllm"
        commands:
          - |
            bash .buildkite/scripts/run_in_docker.sh bash -c '
              cd $(mktemp -d)
              pytest /root/torchtpu-vllm/tests/entrypoints/llm/test_speculative_decoding.py -sv --timeout=300 -m "not nightly"
            '

      - label: "Unit Tests - General (PR)"
        key: "unit_tests_general_pr"
        if: 'build.env("NIGHTLY") != "1"'
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          MODEL_IMPL_TYPE: "vllm"
        commands:
          - |
            bash .buildkite/scripts/run_in_docker.sh bash -c '
              cd $(mktemp -d)
              pytest /root/torchtpu-vllm/tests/ --ignore=/root/torchtpu-vllm/tests/entrypoints/llm/test_speculative_decoding.py -sv --timeout=300 -m "not nightly"
            '

      - label: "Unit Tests - Speculative Decoding (Nightly)"
        key: "unit_tests_spec_decode_nightly"
        if: 'build.env("NIGHTLY") == "1"'
        agents:
          queue: "tpu_v7x_2_queue"
        env:
          MODEL_IMPL_TYPE: "vllm"
        commands:
          - |
            bash .buildkite/scripts/run_in_docker.sh bash -c '
              cd $(mktemp -d)
              pytest /root/torchtpu-vllm/tests/entrypoints/llm/test_speculative_decoding.py -sv --timeout=300
            '

      - label: "Unit Tests - General (Nightly)"
        key: "unit_tests_general_nightly"
        if: 'build.env("NIGHTLY") == "1"'
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          MODEL_IMPL_TYPE: "vllm"
        commands:
          - |
            bash .buildkite/scripts/run_in_docker.sh bash -c '
              cd $(mktemp -d)
              pytest /root/torchtpu-vllm/tests/ --ignore=/root/torchtpu-vllm/tests/entrypoints/llm/test_speculative_decoding.py -sv --timeout=300
            '
