# Kimi-K3 AgentX on the megakernel backend: one recipe point of the "Kimi-K3
# on TPU7x: 1P1D prefill/decode recipes" doc (configs/kimi-k3-megakernel/) on
# the AgentX 1P1D pair (kimi-k3-agentx-1p1d.yaml) - TP32 per role on two tpu7x
# 2x2x4 slices, served with --nnodes by k3_1p1d.sh - and replayed by the pair's
# client through vllm-router. The engines run an image built from another
# branch; the client and the pair's scripts come from the build's commit.
#
# HOW TO TRIGGER
# ──────────────
# Manual builds on vllm-torchtpu-dev, with this file selected:
#   DEV_PIPELINE_FILE=.buildkite/pipeline_k3_megakernel_agentx.yml
# and any of these in the build's environment:
#
#   K3_PD_CONFIG     the point: kimi-k3-megakernel/p1-c1 (default) ...
#                    kimi-k3-megakernel/p7-c16 (p6, p7 experimental)
#   K3_ENGINE_REF    the ref of this repository the engine image is built from:
#                    a branch name, a tag, a full 40-character commit SHA (not a
#                    short one, which cannot be fetched) or refs/pull/<N>/head;
#                    default inferact/megakernel-integration
#   K3_ENGINE_IMAGE  an engine image to use as it is, instead of building one
#
# One point per build, since each needs its own decode server. Point 1 took
# ~45 min from admission: node scale-up, ~5 min for the engines to come up, the
# replay's warmup and its 20 min window (the client's fast mode).
#
# The step passes even when every request fails, because the client exits 0
# after writing what it has: read "requests ok" in summary.md.

env:
  # The kube launcher uploads whatever the workload leaves here as the step's
  # artifacts, as pipeline_perf_kube.yml declares it.
  ARTIFACTS_DIR: "perf_eval_results"

steps:
  # The client image, and the source of the pair's scripts: docker/Dockerfile
  # --target dev at this commit, the same build pipeline_build.yml runs.
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  # Publishes K3_ENGINE_IMAGE, which common.sh hands the manifest.
  - label: ":docker: Build Kimi-K3 megakernel engine image"
    key: k3_engine_image
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/build_k3_engine_image.sh

  - label: ":kubernetes: :tpu: Perf: Kimi-K3 AgentX 1P1D ${K3_PD_CONFIG:-kimi-k3-megakernel/p1-c1} (TPU v7x 2x2x4 x2)"
    key: k3_mk_agentx_1p1d
    depends_on:
      - build_docker
      - k3_engine_image
    # The group the nightly Kimi-K3 pairs in pipeline_perf_kube.yml join, so a
    # build waits for a running pair instead of competing for its slices.
    concurrency_group: "tpu/v7x-2x2x4"
    concurrency: 1
    timeout_in_minutes: 1440
    env:
      K3_PD_CONFIG: "${K3_PD_CONFIG:-kimi-k3-megakernel/p1-c1}"
      # bootstrap_dev.sh leaves its builds unclassed: Kueue priority 0, ahead of
      # the nightlies and behind every other kind of build. post-merge queues
      # this one with main, and it preempts: the 2x2x4 ClusterQueue reclaims
      # within its cohort from LowerPriority workloads, so the quota it lends to
      # other tpu7x shapes is taken back by evicting their jobs (Kueue requeues
      # them).
      WORKLOAD_PRIORITY: "post-merge"
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      # A misspelt point fails here rather than in eight pods after admission.
      - |
        test -f "scripts/vllm/benchmarking/configs/$${K3_PD_CONFIG}.sh" \
          || { echo "no such config: $${K3_PD_CONFIG}" >&2; exit 2; }
      - .buildkite/kubernetes/run_multihost.sh --manifest kimi-k3-agentx-1p1d.yaml
