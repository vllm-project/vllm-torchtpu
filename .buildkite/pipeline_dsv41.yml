# The only lane on epic/dsv41 (see ALL_LANES in scripts/bootstrap.sh). The
# branch targets DeepSeek-V4.1-Flash alone, so the other models' suites are
# not run here.

steps:
  # Temporary PR diagnosis: both revisions use the exact image from build 6215.
  # The normal full-environment gate below still runs independently.
  - label: "DeepSeek-V4.1 typecheck: frozen base/head comparison"
    key: "dsv41_typecheck_comparison"
    timeout_in_minutes: 20
    agents:
      queue: "cpu"
    commands:
      - >-
        python3 .buildkite/scripts/compare_typecheck.py
        --image us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/vllm-torchtpu-ci/vllm-torchtpu:466e8f74db7a550d3b2ed561afe5a7950ce9e404-v0.31.1rc0
        --base c16536c268534317e22f38db4e556094d9a0cc0d
        --head 466e8f74db7a550d3b2ed561afe5a7950ce9e404
    artifact_paths:
      - "perf_eval_results/typecheck-comparison/**/*"

  - label: "Type Check - Full Environment"
    key: "typecheck_full"
    depends_on: "build_docker"
    agents:
      queue: "cpu"
    env:
      CPU_ONLY: "1"
    commands:
      - bash .buildkite/scripts/run_in_docker.sh bash tools/typecheck_full.sh

  - label: "DeepSeek-V4.1 projection/RoPE: dispatch, parity and export"
    key: "dsv41_projection_rope"
    depends_on: "build_docker"
    timeout_in_minutes: 30
    agents:
      queue: "tpu_v7x_2_queue"
    commands:
      - >-
        bash .buildkite/scripts/run_in_docker.sh
        python -m pytest tests/models/vllm/test_dsv41_projection_rope.py
        -q --junitxml=/perf_eval_results/dsv41-projection-rope.xml
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "DeepSeek-V4.1 benchmark scripts: CPU regression tests"
    key: "dsv41_benchmark_scripts_cpu"
    depends_on: "build_docker"
    timeout_in_minutes: 10
    agents:
      queue: "cpu_64_core"
    env:
      CPU_ONLY: "1"
    commands:
      - >-
        bash .buildkite/scripts/run_in_docker.sh
        python -m pytest --confcutdir=tests/scripts
        tests/scripts/test_dsv41_server_session.py
        tests/scripts/test_dsv41_check_summary.py
        tests/scripts/test_dsv41_decode_worker_capture.py
        tests/scripts/test_dsv41_decode_accounting.py
        tests/scripts/test_dsv41_serve_recipe.py
        -q --junitxml=/perf_eval_results/dsv41-benchmark-cpu.xml
    artifact_paths:
      - "perf_eval_results/**/*"

  - label: "DeepSeek-V4.1 index configuration: CPU contracts"
    key: "dsv41_kernel_config_cpu"
    depends_on: "build_docker"
    timeout_in_minutes: 15
    agents:
      queue: "cpu_64_core"
    env:
      CPU_ONLY: "1"
    commands:
      - >-
        bash .buildkite/scripts/run_in_docker.sh
        python -m pytest
        tests/models/vllm/test_dsv41_config.py
        tests/models/vllm/test_dsv41_v2_model_full.py
        tests/models/vllm/test_dsv41_v2_model_sp.py
        tests/models/vllm/test_dsv41_v2_local_q.py
        tests/models/vllm/test_dsv41_v2_prefix_replay.py
        tests/layers/adapter/test_fused_moe_ep.py
        tests/kernels/test_dsv41_decode_tuning.py
        tests/kernels/test_dsv41_decode_index_scores.py
        tests/models/vllm/test_dsv41_decode_indexer_route.py
        -q --junitxml=/perf_eval_results/dsv41-kernel-config.xml
    artifact_paths:
      - "perf_eval_results/**/*"

  - group: "DeepSeek-V4.1-Flash on TPU"
    depends_on: "build_docker"
    steps:
      - label: "DeepSeek-V4.1-Flash: DP8 full-forward smoke + GSM8K"
        key: "dsv41_flash_dp8_ep_gsm8k"
        timeout_in_minutes: 180
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          CONTAINER_SHM_SIZE: "256g"
          TPU_ACCELERATOR_TYPE: "tpu7x"
          VLLM_ENGINE_READY_TIMEOUT_S: "7200"
        commands:
          - >-
            bash .buildkite/scripts/run_in_docker.sh
            env MODEL_URI=gs://wdhongtw-hf-flat/deepseek-ai/DeepSeek-V4.1-Flash
            bash ./scripts/vllm/benchmarking/run_eval_flow.sh
            --config deepseek-v41-flash-dp8-ep
            --run-lm-eval --skip-perf-check
            --results-dir /perf_eval_results/deepseek-v41-flash-dp8-ep
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "DeepSeek-V4.1-Flash: DP8 C384 steady DSpark decode"
        key: "dsv41_flash_dp8_c384_decode"
        # Exercise halfplane Index-K in the TP1/DP8 benchmark path.
        notify:
          - github_check:
              name: "DeepSeek-V4.1 DP8 Decode throughput"
              output:
                title: "DP8 C384 DSpark decode"
                summary: "No valid throughput result has been published yet."
        timeout_in_minutes: 180
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          CONTAINER_SHM_SIZE: "256g"
          TPU_ACCELERATOR_TYPE: "tpu7x"
          VLLM_ENGINE_READY_TIMEOUT_S: "7200"
        commands:
          - >-
            bash .buildkite/scripts/run_in_docker.sh
            bash .buildkite/scripts/run_dsv41_dp8_benchmark.sh
            decode
            gs://wdhongtw-hf-flat/deepseek-ai/DeepSeek-V4.1-Flash
            /perf_eval_results/deepseek-v41-flash-dp8-96k-c384-decode
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "DeepSeek-V4.1-Flash: DP8 C8 cached 96K + 16K extend"
        key: "dsv41_flash_dp8_c8_cached_extend"
        # Exercise halfplane Index-K in the TP1/DP8 benchmark path.
        notify:
          - github_check:
              name: "DeepSeek-V4.1 DP8 Prefill throughput"
              output:
                title: "DP8 C8 cached 96K + 16K extend"
                summary: "No valid throughput result has been published yet."
        timeout_in_minutes: 180
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          CONTAINER_SHM_SIZE: "256g"
          TPU_ACCELERATOR_TYPE: "tpu7x"
          VLLM_ENGINE_READY_TIMEOUT_S: "7200"
        commands:
          - >-
            bash .buildkite/scripts/run_in_docker.sh
            bash .buildkite/scripts/run_dsv41_dp8_benchmark.sh
            encoder_extend
            gs://wdhongtw-hf-flat/deepseek-ai/DeepSeek-V4.1-Flash
            /perf_eval_results/deepseek-v41-flash-dp8-96k-c8-cached-extend
        artifact_paths:
          - "perf_eval_results/**/*"
