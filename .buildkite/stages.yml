# Single source of stage order and inter-stage dependencies, rendered into one
# Buildkite pipeline upload by .buildkite/scripts/render_pipeline.py.

stages:
  # Build the CI and Omni Docker images used by downstream pod steps.
  - key: build
    files:
      - path: .buildkite/pipeline_build.yml

  # Fast CPU checks (typecheck and CPU unit tests) that gate TPU capacity.
  - key: precheck
    needs:
      - stage: build
    files:
      - path: .buildkite/pipeline_cpu.yml
        lane: tests

  # TPU unit, integration, perf/eval, and model/feature suites.
  - key: tpu
    concurrency:
      group: "tpu-pr/{author}"
      limit: 1
      when: [ci-run]
    needs:
      - stage: precheck
        unless: [nightly, oncall-fix, release-tag]
      - stage: build
    files:
      - path: .buildkite/pipeline_tests.yml
        lane: tests
      - path: .buildkite/pipeline_integration.yml
        lane: integration
      - path: .buildkite/pipeline_perf.yml
        lane: perf
      - path: .buildkite/pipeline_models.yml
        lane: verify
        dynamic_keys: [v6e-group, v7x-group]

  # Nightly and release support-matrix generation and verified-commit report.
  - key: report
    needs:
      - stage: precheck
      - stage: tpu
    files:
      - path: .buildkite/pipeline_verify.yml
        lane: verify

  # Advance the pinned upstream vLLM LKG commit on the integration pipeline.
  - key: promote
    needs:
      - stage: tpu
      - stage: report
    files:
      - path: .buildkite/pipeline_promote.yml
        pipeline: integration
