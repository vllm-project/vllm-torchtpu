steps:
  - group: "Build Docker Images"
    key: "build_docker_group"
    steps:
      - label: ":docker: Build and Push CI Image"
        key: "build_docker"
        agents:
          queue: cpu_64_core
        commands:
          - bash .buildkite/scripts/setup_docker_env.sh
