# vllm-torchtpu-release: everything vllm-torchtpu publishes. It runs only in
# the TPU Release Buildkite cluster, on the release-vllm-torchtpu queue, whose
# agent alone can read the Docker Hub token and mint PyPI tokens.
#
# The pipeline's settings upload this file from the build's own checkout, for
# builds of main and releases/v* only, so a release branch runs the release
# tooling it was cut with. README.md has the how-to.
#
#   main (scheduled)    nightly images: ci/dev/prod to GAR, dev to Docker Hub
#   releases/vX.Y.Z     a release: build the images and wheels once, check them,
#                       wait for approval, then publish those same bytes
#                       (plan_publish.py)

steps:
  - label: ":docker: Nightly images (GAR, and Docker Hub nightly)"
    key: nightly_images
    if: build.branch == "main"
    agents:
      queue: release-vllm-torchtpu
    env:
      PUBLISH_DOCKERHUB: "1"
      DOCKERHUB_REPO: "vllm/vllm-torchtpu"
      DOCKERHUB_USERNAME: "vllm"
    secrets:
      - DOCKERHUB_TOKEN_VLLM_TORCHTPU
    commands:
      - bash .buildkite/scripts/publish_nightly_images.sh

  # --- A release ------------------------------------------------------------

  - label: ":clipboard: Preflight: version, CI, PyPI"
    key: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-vllm-torchtpu
    commands:
      - bash .buildkite/release/preflight.sh

  - label: ":docker: Build and stage the images"
    key: build_images
    depends_on: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-vllm-torchtpu
    timeout_in_minutes: 180
    commands:
      - bash .buildkite/release/build_images.sh

  - label: ":package: Build the vllm-torchtpu-core wheel"
    key: build_core_wheel
    depends_on: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-vllm-torchtpu
    env:
      PUBLISH_PYPI: "vllm-torchtpu-core"  # build_core_wheel.sh fails early if it's on PyPI
    commands:
      - bash .buildkite/scripts/build_core_wheel.sh

  - label: ":package: Build the vllm-torchtpu wheel"
    key: build_vllm_torchtpu
    depends_on: build_core_wheel
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-vllm-torchtpu
    commands:
      - |
        set -euo pipefail
        VERSION="$$(buildkite-agent meta-data get release-version)"
        bash .buildkite/scripts/build_vllm_torchtpu.sh "$$VERSION"
        buildkite-agent artifact upload "dist/vllm_torchtpu-*.whl"
        buildkite-agent artifact upload "dist/vllm_torchtpu-*.tar.gz"

  - label: ":mag: Check the wheels install from PyPI"
    key: check_wheels
    depends_on: build_vllm_torchtpu
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-vllm-torchtpu
    commands:
      - bash .buildkite/release/check_wheels.sh

  - label: ":pipeline: Plan the approval and publish"
    key: plan_publish
    depends_on:
      - build_images
      - check_wheels
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-vllm-torchtpu
    commands:
      - python3 .buildkite/release/plan_publish.py | buildkite-agent pipeline upload --no-interpolation
