# DO NOT MERGE: throwaway CI bisect. Runs only the two Gemma-4 configs of the
# general suite, one after the other in a single job.

steps:
  - group: "Perf and Eval on TPU"
    depends_on: "build_docker"
    steps:
      - label: "Perf/Eval: General suite (TPU v7x-8)"
        key: "perf_eval_general_tpu_v7x_8"
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          TPU_ACCELERATOR_TYPE: "tpu7x"
          VLLM_ENGINE_READY_TIMEOUT_S: "7200"
          BENCHMARK_WARMUP_RUNS: "1"
        commands:
          - |
            bash .buildkite/scripts/run_in_docker.sh env XLA_FLAGS=--xla_enable_hlo_sharding_v3=false bash ./scripts/vllm/benchmarking/run_eval_configs.sh \
              gemma-4-31b-fp8-dp4-tp2-multimodal \
              gemma-4-26b-fp8-dp4-tp2-multimodal
        artifact_paths:
          - "perf_eval_results/**/*"
