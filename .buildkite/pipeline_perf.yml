steps:
  - group: "Perf and Eval on TPU"
    depends_on: "build_docker"
    steps:
      - label: "Perf/Eval: qwen3-coder-30b-tp8-ep"
        key: "perf_qwen3_coder_30b_tp8_ep"
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          MODEL_IMPL_TYPE: "vllm"
          BENCHMARK_WARMUP_RUNS: "1"
        commands:
          - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config qwen3-coder-30b-tp8-ep --run-lm-eval --results-dir /perf_eval_results"
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Perf/Eval: qwen3-coder-30b-fp8-tp8-ep"
        key: "perf_qwen3_coder_30b_fp8_tp8_ep"
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          MODEL_IMPL_TYPE: "vllm"
          BENCHMARK_WARMUP_RUNS: "1"
        commands:
          - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config qwen3-coder-30b-fp8-tp8-ep --run-lm-eval --results-dir /perf_eval_results"
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Perf/Eval: qwen3.5-35b-fp8-tp4-ep"
        key: "perf_qwen3_5_35b_fp8_tp4_ep"
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          MODEL_IMPL_TYPE: "vllm"
          BENCHMARK_WARMUP_RUNS: "1"
        commands:
          - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config qwen3.5-35b-fp8-tp4-ep --run-lm-eval --results-dir /perf_eval_results"
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Perf/Eval: qwen3-0.6b-tp1"
        key: "perf_qwen3_0_6b_tp1"
        agents:
          queue: "tpu_v7x_2_queue"
        env:
          MODEL_IMPL_TYPE: "vllm"
          BENCHMARK_WARMUP_RUNS: "1"
        commands:
          - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config qwen3-0.6b-tp1 --run-lm-eval --results-dir /perf_eval_results"
        artifact_paths:
          - "perf_eval_results/**/*"

      # Nightly runs
      - label: "Perf/Eval: qwen3-coder-480b-fp8-tp8-ep (Nightly)"
        key: "perf_qwen3_coder_480b_fp8_tp8_ep"
        if: 'build.env("NIGHTLY") == "1"'
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          MODEL_IMPL_TYPE: "vllm"
          EVALPLUS_DATASETS: "humaneval mbpp"
          EVALPLUS_PARALLEL: "8"
        commands:
          - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config qwen3-coder-480b-fp8-tp8-ep --run-lm-eval --run-evalplus --results-dir /perf_eval_results"
        artifact_paths:
          - "perf_eval_results/**/*"

      - label: "Perf/Eval: qwen3.5-397b-fp8-tp8-ep (Nightly)"
        key: "perf_qwen3_5_397b_fp8_tp8_ep"
        if: 'build.env("NIGHTLY") == "1"'
        agents:
          queue: "tpu_v7x_8_queue"
        env:
          MODEL_IMPL_TYPE: "vllm"
          EVALPLUS_DATASETS: "humaneval mbpp"
          EVALPLUS_PARALLEL: "8"
        commands:
          - "bash .buildkite/scripts/run_in_docker.sh bash ./scripts/vllm/benchmarking/run_eval_flow.sh --config qwen3.5-397b-fp8-tp8-ep --run-lm-eval --run-evalplus --results-dir /perf_eval_results"
        artifact_paths:
          - "perf_eval_results/**/*"
