# The verify lane on the Kueue fleet: the steps in models/*.yml, uploaded with
# kube shapes by upload_models_and_features.sh --kube, and their record steps.
#
# The support-matrix steps of pipeline_verify.yml are not here. They end in
# commit_support_matrices and record_verified_commit_hashes, which push to the
# repository, and a kube pod has no credentials to push with; a matrix nobody
# commits is not worth generating.

x-run-condition: &run-on-nightly-or-tag
  if: build.env("NIGHTLY") == "1" || build.tag =~ /^v?[0-9]+(\.[a-zA-Z0-9]+)*([a-zA-Z]+[0-9]*)?$/

steps:
  - label: "Upload Tests for Models & Features"
    <<: *run-on-nightly-or-tag
    agents:
      queue: cpu
    commands:
      - bash .buildkite/scripts/upload_models_and_features.sh --kube
