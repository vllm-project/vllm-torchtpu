# DISAGG_DP_SIZE is forwarded to all roles by common.sh; default DP8, or TP2/DP4.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  annotations:
    tpu-ci.google.com/defaults: standard
spec:
  network:
    enableDNSHostnames: true
  successPolicy:
    operator: All
    targetReplicatedJobs: [benchmark]
  replicatedJobs:
    - name: prefill
      replicas: 1
      template: &engine_job
        spec: &engine_spec
          parallelism: 1
          completions: 1
          completionMode: Indexed
          activeDeadlineSeconds: 36000
          template:
            spec: &engine_pod
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              containers:
                - &engine_container
                  name: workload
                  image: ${IMAGE}
                  command: ["/bin/bash", "/workspace/vllm-torchtpu/.buildkite/kubernetes/disagg_engine.sh", "prefill"]
                  env:
                    - name: DISAGG_PROFILE
                      value: qwen3.8-flash
                    - name: WORKLOAD_NAME
                      value: ${WORKLOAD_NAME}
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: VLLM_XLA_CACHE_PATH
                      value: /cache/jax/xla
                    - name: VLLM_CACHE_ROOT
                      value: /cache/jax/vllm
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    periodSeconds: 10
                  ports:
                    - containerPort: 8000
                  resources:
                    requests:
                      google.com/tpu: "4"
                    limits:
                      google.com/tpu: "4"
                  volumeMounts:
                    - name: vllm-profile-cache
                      mountPath: /cache/jax/vllm/profile_cache
              volumes:
                - name: vllm-profile-cache
                  emptyDir:
                    medium: Memory
                    sizeLimit: 16Gi
    - name: decode
      replicas: 1
      template:
        <<: *engine_job
        spec:
          <<: *engine_spec
          template:
            spec:
              <<: *engine_pod
              containers:
                - <<: *engine_container
                  command: ["/bin/bash", "/workspace/vllm-torchtpu/.buildkite/kubernetes/disagg_engine.sh", "decode"]
    - name: benchmark
      replicas: 1
      dependsOn:
        - name: prefill
          status: Ready
        - name: decode
          status: Ready
      template:
        spec:
          parallelism: 1
          completions: 1
          completionMode: Indexed
          activeDeadlineSeconds: 36000
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/compute-class: worker-cpu
              serviceAccountName: tpu-workload
              containers:
                - name: workload
                  image: ${IMAGE}
                  command: ["/bin/bash", "/workspace/vllm-torchtpu/.buildkite/kubernetes/disagg_benchmark.sh"]
                  env:
                    - name: DISAGG_PROFILE
                      value: qwen3.8-flash
                    - name: WORKLOAD_NAME
                      value: ${WORKLOAD_NAME}
                    - name: RUN_TYPE
                      value: KUBE_DISAGG
                    - name: REPOSITORY
                      value: vllm-torchtpu
                    - name: DOCKER_IMAGE
                      value: ${IMAGE}
                    - name: BQ_UPLOAD
                      value: "0"
                    - name: VLLM_PLUGINS
                      value: ""
                    - name: TORCH_DEVICE_BACKEND_AUTOLOAD
                      value: "0"
                    - name: PYTHONUNBUFFERED
                      value: "1"
                  resources:
                    requests:
                      cpu: "6"
                      memory: 16Gi
                      ephemeral-storage: 20Gi
                    limits:
                      cpu: "6"
                      memory: 16Gi
                      ephemeral-storage: 20Gi
