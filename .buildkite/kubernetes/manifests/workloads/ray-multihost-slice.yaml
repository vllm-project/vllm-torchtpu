# A benchmark across both hosts of a 2x2x2 v7x slice. The step supplies
# MULTIHOST_ARGS_B64, the command multihost_entry.sh runs on the Ray head.
#
# One replicatedJob for both roles, because GKE places a multi-host slice as the
# pods of a single Job and two Jobs asking for 2x2x2 would get two slices with
# no interconnect. JOB_COMPLETION_INDEX decides the role, and a larger slice
# means changing topology and parallelism together.
#
# ${WORKLOAD_NAME} and ${IMAGE} are substituted; a literal dollar is $$.

apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  annotations:
    # The fleet's pod setup - caches, tolerations, retries. See
    # manifests/README.md.
    tpu-ci.google.com/defaults: standard
spec:
  # Gives each pod a DNS name - <jobset>-slice-0-<index> under a headless
  # service named for the JobSet - which is what HEAD_HOST below is built from.
  network:
    enableDNSHostnames: true
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          # One host per node of the slice. Indexed is required both by
          # enableDNSHostnames and by GKE's multi-host TPU placement.
          parallelism: 2
          completions: 2
          completionMode: Indexed
          # Eight hours, over the fleet's three-hour default, because these
          # models compile for the better part of an hour before the sweep
          # starts. Raising it shrinks the admission window: a workload gets
          # the fleet's eleven-hour total minus this deadline to find chips.
          activeDeadlineSeconds: 28800
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x2
                cloud.google.com/gke-tpu-accelerator: tpu7x
              containers:
                - name: workload
                  image: ${IMAGE}
                  command: ["/bin/bash", "-lc"]
                  args:
                    - |
                      export VLLM_HOST_IP="$${POD_IP}"
                      readarray -d '' _args < <(printf '%s' "$${MULTIHOST_ARGS_B64}" | base64 -d)
                      exec bash .buildkite/kubernetes/multihost_entry.sh "$${_args[@]}"
                  env:
                    - name: HEAD_HOST
                      value: ${WORKLOAD_NAME}-slice-0-0.${WORKLOAD_NAME}
                    # Must match parallelism above: how many Ray nodes the head
                    # waits for before starting the benchmark.
                    - name: NUM_HOSTS
                      value: "2"
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    # Only $$HF_HOME/hub is a mount; lm-eval's datasets are
                    # large enough to fill the pod's ephemeral storage anywhere
                    # else.
                    - name: HF_DATASETS_CACHE
                      value: /cache/hf/hub/datasets
                    # The pod is deleted when the run ends, so a session log
                    # directory on its filesystem is unreachable by then.
                    - name: RAY_LOG_TO_STDERR
                      value: "1"
                    # Both caches on the fleet's compilation bucket. The
                    # default for VLLM_CACHE_ROOT is under $$HOME, on the
                    # node's boot disk, which it does not fit on.
                    - name: VLLM_XLA_CACHE_PATH
                      value: /cache/jax/xla
                    - name: VLLM_CACHE_ROOT
                      value: /cache/jax/vllm
                  ports:
                    - containerPort: 8000
                  # Only the chips: the pod holds every chip on the node, and a
                  # cpu request here can stop the pool scaling up at all.
                  resources:
                    limits:
                      google.com/tpu: "4"
                    requests:
                      google.com/tpu: "4"
                  volumeMounts:
                    # Shadows one subtree of the inherited jax cache:
                    # profile_cache must not persist, or a later run loads the
                    # kv=0 graph instead of compiling it and the free-HBM probe
                    # measures nothing.
                    - name: vllm-profile-cache
                      mountPath: /cache/jax/vllm/profile_cache
              volumes:
                - name: vllm-profile-cache
                  emptyDir:
                    medium: Memory
                    sizeLimit: 16Gi
