# Kimi-K3 1P1D: prefill and decode each on a 2x2x4 slice, four hosts of four
# chips, one Ray engine per slice. See k3_1p1d.sh.
#
# Both roles ask for the same shape, so the workload is admitted against one
# queue for all 32 chips. A slice is one node pool, and exclusive-topology on
# the node pool gives each role a slice of its own rather than splitting both
# across the two.
#
# ${WORKLOAD_NAME} and ${IMAGE} are substituted before submission, so a literal
# dollar is $$. Every container is named `workload`.

apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  annotations:
    tpu-ci.google.com/defaults: standard
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  # <jobset>-<role>-0-<index> under a headless service named for the JobSet,
  # which is how each slice finds its head and the prefill head finds decode.
  network:
    enableDNSHostnames: true
  # Decode serves until told to stop, so prefill finishing - after the check -
  # is what finishes the run; JobSet then tears decode down.
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - prefill
  replicatedJobs:
    # A group of its own per role. GKE's TPU webhook sets MEGASCALE_NUM_SLICES
    # and MEGASCALE_SLICE_ID from the job's group, so two roles sharing the
    # default group each come up as half of a two-slice job and wait in libtpu
    # for a second slice that never joins.
    - name: prefill
      groupName: prefill
      replicas: 1
      template:
        spec:
          parallelism: 4
          completions: 4
          # Indexed because enableDNSHostnames requires it.
          completionMode: Indexed
          # Over the fleet's default: two cold Kimi-K3 boots stream 1.5 TB each
          # and compile, then the correctness stages and lm_eval run.
          activeDeadlineSeconds: 28800
          backoffLimit: 0
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x4
                cloud.google.com/gke-tpu-accelerator: tpu7x
              containers:
                - name: workload
                  image: ${IMAGE}
                  command: ["/bin/bash", "/workspace/vllm-torchtpu/.buildkite/kubernetes/k3_1p1d.sh", "prefill"]
                  env:
                    - name: HEAD_HOST
                      value: ${WORKLOAD_NAME}-prefill-0-0.${WORKLOAD_NAME}
                    - name: DECODE_HOST
                      value: ${WORKLOAD_NAME}-decode-0-0.${WORKLOAD_NAME}
                    - name: NUM_HOSTS
                      value: "4"
                    # The downward API, so it cannot come from the script.
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: TPU_ACCELERATOR_TYPE
                      value: tpu7x
                    - name: RAY_LOG_TO_STDERR
                      value: "1"
                    # As the v7x-16 perf steps: the boot's temporary files are
                    # tens of GB, more than the container's disk.
                    - name: TMPDIR
                      value: /dev/shm
                    - name: RAY_TMPDIR
                      value: /tmp
                    - name: VLLM_XLA_CACHE_PATH
                      value: /cache/jax/xla
                    - name: VLLM_CACHE_ROOT
                      value: /cache/jax/vllm
                    # The correctness stages and run_eval_flow.sh write their
                    # results here, and multihost_entry.sh uploads it from the
                    # head.
                    - name: ARTIFACTS_DIR
                      value: perf_eval_results
                  ports:
                    - containerPort: 8000
                    - containerPort: 8100
                  # Only the chips: memory comes from the shape's profile, and a
                  # cpu request can stop the pool scaling up at all.
                  resources:
                    limits:
                      google.com/tpu: "4"
                    requests:
                      google.com/tpu: "4"
                  volumeMounts:
                    # profile_cache must not persist, or a later run loads the
                    # kv=0 graph instead of compiling it.
                    - name: vllm-profile-cache
                      mountPath: /cache/jax/vllm/profile_cache
              volumes:
                - name: vllm-profile-cache
                  emptyDir:
                    medium: Memory
                    sizeLimit: 16Gi

    - name: decode
      groupName: decode
      replicas: 1
      template:
        spec:
          parallelism: 4
          completions: 4
          completionMode: Indexed
          activeDeadlineSeconds: 28800
          backoffLimit: 0
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x4
                cloud.google.com/gke-tpu-accelerator: tpu7x
              containers:
                - name: workload
                  image: ${IMAGE}
                  command: ["/bin/bash", "/workspace/vllm-torchtpu/.buildkite/kubernetes/k3_1p1d.sh", "decode"]
                  env:
                    - name: HEAD_HOST
                      value: ${WORKLOAD_NAME}-decode-0-0.${WORKLOAD_NAME}
                    - name: DECODE_HOST
                      value: ${WORKLOAD_NAME}-decode-0-0.${WORKLOAD_NAME}
                    - name: NUM_HOSTS
                      value: "4"
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: TPU_ACCELERATOR_TYPE
                      value: tpu7x
                    - name: RAY_LOG_TO_STDERR
                      value: "1"
                    - name: TMPDIR
                      value: /dev/shm
                    - name: RAY_TMPDIR
                      value: /tmp
                    - name: VLLM_XLA_CACHE_PATH
                      value: /cache/jax/xla
                    - name: VLLM_CACHE_ROOT
                      value: /cache/jax/vllm
                  ports:
                    - containerPort: 8000
                  resources:
                    limits:
                      google.com/tpu: "4"
                    requests:
                      google.com/tpu: "4"
                  volumeMounts:
                    - name: vllm-profile-cache
                      mountPath: /cache/jax/vllm/profile_cache
              volumes:
                - name: vllm-profile-cache
                  emptyDir:
                    medium: Memory
                    sizeLimit: 16Gi
