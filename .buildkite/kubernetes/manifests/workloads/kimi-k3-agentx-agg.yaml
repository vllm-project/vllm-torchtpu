# Kimi-K3 aggregate serving the InferenceX AgentX trace replay: one megakernel
# engine (prefill and decode programs, TP32) on one 2x2x4 slice (k3_1p1d.sh
# aggregate), driven by a chipless client pod that owns a loopback forwarder and
# the benchmark (k3_agentx_client_pod.sh with K3_PD_AGGREGATE=1). Otherwise as
# kimi-k3-agentx-1p1d.yaml: ${WORKLOAD_NAME}, ${IMAGE}, ${K3_ENGINE_IMAGE} and
# ${K3_FLEET_CACHES} are substituted before submission, a literal dollar is $$,
# and the engine runs this commit's .buildkite/kubernetes and configs.

apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  annotations:
    tpu-ci.google.com/defaults: standard
    # The fleet's caches: `none` for the megakernel points, empty (kept) for
    # the rest (common.sh). A megakernel boot streams the TP32 pre-shard once,
    # and through the fleet's /cache/hf/hub the shards fill a 65Gi gcsfuse file
    # cache, which is host memory: 61-67 GiB on every engine host in
    # vllm-torchtpu-dev builds 562, 588 and 589, enough to get build 562's
    # prefill head evicted under a 1.5 TiB host KV store. Without the caches
    # the points also compile from scratch every boot, into the container's
    # disk. Quoted, so that empty is an empty string rather than null.
    tpu-ci.google.com/caches: "${K3_FLEET_CACHES}"
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  # <jobset>-aggregate-0-<index> under a headless service named for the JobSet,
  # which is how each host finds the others.
  network:
    enableDNSHostnames: true
  # The engine serves until told to stop, so the client finishing is what
  # finishes the run; JobSet then tears the engines down.
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - client
  replicatedJobs:
    # A group of its own per role: GKE's TPU webhook derives MEGASCALE_NUM_SLICES
    # from the group, and two roles sharing one would each wait in libtpu for a
    # second slice that never joins.
    - name: aggregate
      groupName: aggregate
      replicas: 1
      template:
        spec:
          parallelism: 4
          completions: 4
          completionMode: Indexed
          activeDeadlineSeconds: 28800
          backoffLimit: 0
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x4
                cloud.google.com/gke-tpu-accelerator: tpu7x
              # This commit's pair scripts and configs, for the engine image.
              initContainers:
                - name: lane-scripts
                  image: ${IMAGE}
                  command: ["/bin/sh", "-c", "cp -a /workspace/vllm-torchtpu/.buildkite/kubernetes /lane/kubernetes && cp -a /workspace/vllm-torchtpu/scripts/vllm/benchmarking/configs /lane/configs"]
                  volumeMounts:
                    - name: lane-scripts
                      mountPath: /lane
              containers:
                - name: workload
                  image: ${K3_ENGINE_IMAGE}
                  command: ["/bin/bash", "/workspace/vllm-torchtpu/.buildkite/kubernetes/k3_1p1d.sh", "aggregate"]
                  env:
                    # Host i of this role is <prefix>i.<domain>.
                    - name: ROLE_HOST_PREFIX
                      value: ${WORKLOAD_NAME}-aggregate-0-
                    - name: ROLE_HOST_DOMAIN
                      value: ${WORKLOAD_NAME}
                    - name: DECODE_HOST
                      value: ${WORKLOAD_NAME}-aggregate-0-0.${WORKLOAD_NAME}
                    - name: PREFILL_HOST
                      value: ${WORKLOAD_NAME}-aggregate-0-0.${WORKLOAD_NAME}
                    - name: NUM_HOSTS
                      value: "4"
                    # Both roles and the client read this one config.
                    - name: K3_PD_CONFIG
                      value: kimi-k3-tp8-dp4-ep-agentx
                    # Serve only; the client pod drives the run.
                    - name: K3_PD_EXTERNAL_CLIENT
                      value: "1"
                    - name: K3_ENGINE_IMAGE
                      value: ${K3_ENGINE_IMAGE}
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: TPU_ACCELERATOR_TYPE
                      value: tpu7x
                    - name: TMPDIR
                      value: /dev/shm
                    - name: VLLM_XLA_CACHE_PATH
                      value: /cache/jax/xla
                    - name: VLLM_CACHE_ROOT
                      value: /cache/jax/vllm
                  ports:
                    - containerPort: 8000
                  resources:
                    limits:
                      google.com/tpu: "4"
                    requests:
                      google.com/tpu: "4"
                  volumeMounts:
                    - name: vllm-profile-cache
                      mountPath: /cache/jax/vllm/profile_cache
                    - name: lane-scripts
                      mountPath: /workspace/vllm-torchtpu/.buildkite/kubernetes
                      subPath: kubernetes
                    - name: lane-scripts
                      mountPath: /workspace/vllm-torchtpu/scripts/vllm/benchmarking/configs
                      subPath: configs
                    - name: k3-checkpoint
                      mountPath: /ckpt/k3
                      readOnly: true
                    - name: k3-presharded
                      mountPath: /cache/hf/hub/presharded/kimi-k3-tp32
                      readOnly: true
                    - name: k3-dspark
                      mountPath: /cache/hf/hub/models--RedHatAI--Kimi-K3-speculator.dspark
                      readOnly: true
                    - name: k3-dspark-mla
                      mountPath: /cache/hf/hub/models--Inferact--Kimi-K3-DSpark
                      readOnly: true
              volumes:
                - name: vllm-profile-cache
                  emptyDir:
                    medium: Memory
                    sizeLimit: 16Gi
                - name: lane-scripts
                  emptyDir: {}
                # The checkpoint's files (gs://tpu-commons-ci/moonshootai/kimi/k3),
                # at the path the TP32 pre-shard was written from.
                - name: k3-checkpoint
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    readOnly: true
                    volumeAttributes:
                      bucketName: tpu-commons-ci
                      mountOptions: "implicit-dirs,only-dir=moonshootai/kimi/k3"
                      skipCSIBucketAccessCheck: "true"
                # The pre-shard and the speculator, as prefill's.
                - name: k3-presharded
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    readOnly: true
                    volumeAttributes:
                      bucketName: tpu-ci-models-60b4c3c7
                      mountOptions: "implicit-dirs,only-dir=presharded/kimi-k3-tp32,read_ahead_kb=131072"
                      skipCSIBucketAccessCheck: "true"
                - name: k3-dspark
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    readOnly: true
                    volumeAttributes:
                      bucketName: tpu-ci-models-60b4c3c7
                      mountOptions: "implicit-dirs,only-dir=models--RedHatAI--Kimi-K3-speculator.dspark"
                      skipCSIBucketAccessCheck: "true"
                - name: k3-dspark-mla
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    readOnly: true
                    volumeAttributes:
                      bucketName: tpu-ci-models-60b4c3c7
                      mountOptions: "implicit-dirs,only-dir=models--Inferact--Kimi-K3-DSpark"
                      skipCSIBucketAccessCheck: "true"

    # Chipless, so it is scheduled by its requests onto a worker-cpu node rather
    # than onto a slice, as qwen3.5-397b-1p1d.yaml's benchmark role is.
    - name: client
      dependsOn:
        - name: aggregate
          status: Ready
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          # Longer than the engines': it waits out the boot, then runs the
          # ladder.
          activeDeadlineSeconds: 32400
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              annotations:
                gke-gcsfuse/volumes: "true"
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/compute-class: worker-cpu
              serviceAccountName: tpu-workload
              containers:
                - name: workload
                  image: ${IMAGE}
                  command: ["/bin/bash", "/workspace/vllm-torchtpu/.buildkite/kubernetes/k3_agentx_client_pod.sh"]
                  env:
                    # The engine head is <name>-aggregate-0-0.<name>.
                    - name: WORKLOAD_NAME
                      value: ${WORKLOAD_NAME}
                    # The same config the engines booted; read here for the cases.
                    - name: K3_PD_CONFIG
                      value: kimi-k3-tp8-dp4-ep-agentx
                    # Physical chips the engine holds: 4 hosts x google.com/tpu 4.
                    - name: AGENTX_CHIPS
                      value: "16"
                    - name: K3_PD_AGGREGATE
                      value: "1"
                    # This pod's results are the step's only output.
                    - name: ARTIFACTS_DIR
                      value: perf_eval_results
                    # On a chipless pod the torchtpu plugin makes vLLM's CLI
                    # call torch.device("tpu"), and `import torch` auto-imports
                    # torch_tpu, whose native init aborts without libtpu.
                    - name: VLLM_PLUGINS
                      value: ""
                    - name: TORCH_DEVICE_BACKEND_AUTOLOAD
                      value: "0"
                    - name: PYTHONUNBUFFERED
                      value: "1"
                    - name: TMPDIR
                      value: /tmp
                  # Guaranteed (request == limit): it shares a worker-cpu node.
                  # The memory is aiperf tokenizing 100k-token traces; the disk
                  # is the corpus and the InferenceX checkout.
                  resources:
                    requests:
                      cpu: "12"
                      memory: "32Gi"
                      ephemeral-storage: "30Gi"
                    limits:
                      cpu: "12"
                      memory: "32Gi"
                      ephemeral-storage: "30Gi"
                  volumeMounts:
                    # The Formosa timed-trace suite (shards and tokenizer) for a
                    # FORMOSA_BENCH point; unused otherwise.
                    - name: formosa-suite
                      mountPath: /formosa
                      readOnly: true
              volumes:
                - name: formosa-suite
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    readOnly: true
                    volumeAttributes:
                      bucketName: tpu-ci-models-60b4c3c7
                      mountOptions: "implicit-dirs,only-dir=benchmarks/formosa_timed_trace_suite"
                      skipCSIBucketAccessCheck: "true"
