# The DeepSeek-V4-Flash P/D disaggregation correctness test as a Kueue
# workload: DP8 prefill on one tpu7x-standard-4t host, DP8 decode on another.
#
# Shaped exactly like qwen3.5-p8d8-disagg.yaml, which explains the roles, the
# addressing and why neither carries a readiness probe. What differs is the
# test script and the model: the checkpoint is streamed from GCS with
# runai_streamer rather than resolved from the HF cache, because at 149 GiB it
# is not in the claim and DeepSeek-V4-Flash, undated, is the bucket's copy.
#
# ${WORKLOAD_NAME} and ${IMAGE} are substituted before submission, so a literal
# dollar is $$. Every container is named `workload`: the launcher forwards step
# environment into that name and reads its logs.

apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  annotations:
    tpu-ci.google.com/defaults: standard
spec:
  network:
    enableDNSHostnames: true
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - head
  replicatedJobs:
    - name: decode
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          completionMode: Indexed
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              containers:
              - name: workload
                image: ${IMAGE}
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    exec bash .buildkite/kubernetes/single_host_engine.sh \
                      bash ./scripts/vllm/integration/run_dsv4_pd_correctness.sh
                env:
                - name: ROLE
                  value: decode
                - name: RUN_DIR
                  value: /tmp/dsv4_pd_disagg_ci/run
                - name: STREAM_LOG
                  value: $$(RUN_DIR)/logs/decode.log
                - name: MODEL_PATH
                  value: gs://tpu-commons-ci/models--deepseek-ai--DeepSeek-V4-Flash/snapshots/60d8d70770c6776ff598c94bb586a859a38244f1
                - name: SERVED_MODEL_NAME
                  value: deepseek-ai/DeepSeek-V4-Flash
                - name: PREFILL_HOST
                  value: ${WORKLOAD_NAME}-head-0-0.${WORKLOAD_NAME}
                - name: DECODE_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: TPU_RAIDEN_ADVERTISE_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                # The launcher waits this long for its own server before giving
                # up. Its default is sized for a warm boot; streaming the
                # checkpoint into a cold compile cache takes longer.
                - name: STARTUP_TIMEOUT_S
                  value: "5400"
                - name: VLLM_XLA_CACHE_PATH
                  value: /cache/jax/xla
                - name: VLLM_CACHE_ROOT
                  value: /cache/jax/vllm
                resources:
                  limits:
                    google.com/tpu: "4"
                  requests:
                    google.com/tpu: "4"

    - name: head
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          completionMode: Indexed
          backoffLimit: 0
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              containers:
              - name: workload
                image: ${IMAGE}
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    exec bash .buildkite/kubernetes/single_host_engine.sh \
                      bash ./scripts/vllm/integration/run_dsv4_pd_correctness.sh
                env:
                - name: ROLE
                  value: head
                - name: RUN_DIR
                  value: /tmp/dsv4_pd_disagg_ci/run
                - name: STREAM_LOG
                  value: $$(RUN_DIR)/logs/prefill.log
                - name: MODEL_PATH
                  value: gs://tpu-commons-ci/models--deepseek-ai--DeepSeek-V4-Flash/snapshots/60d8d70770c6776ff598c94bb586a859a38244f1
                - name: SERVED_MODEL_NAME
                  value: deepseek-ai/DeepSeek-V4-Flash
                - name: DECODE_HOST
                  value: ${WORKLOAD_NAME}-decode-0-0.${WORKLOAD_NAME}
                - name: PREFILL_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: TPU_RAIDEN_ADVERTISE_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                # Also the head's wait for both /health endpoints, which spans
                # the decode pod's boot as well as its own.
                - name: STARTUP_TIMEOUT_S
                  value: "5400"
                - name: VLLM_XLA_CACHE_PATH
                  value: /cache/jax/xla
                - name: VLLM_CACHE_ROOT
                  value: /cache/jax/vllm
                resources:
                  limits:
                    google.com/tpu: "4"
                  requests:
                    google.com/tpu: "4"
