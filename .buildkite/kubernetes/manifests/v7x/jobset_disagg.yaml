# 1P1D end-to-end benchmark on the Raiden KV-transfer engine: PCP8/TP1
# prefill + DP8/TP1 decode (the topologies Raiden's Qwen3.5 admission
# requires) and TPURaidenConnector with the stage-3 reshard transport.
# The reshard control plane runs in store mode: each engine's
# transfer-rank-0 worker hosts the service in-process, so there is no
# controller sidecar. Kernel-selection env stays at defaults.
#
# The workload follows the tpu_benchmark_daily client shapes: 8192/1
# sweep c8-256, TTFT 8K-64K (128K/252K need max-model-len beyond the
# shared 66560), decode rounds C8/P8192/D1024 and C256/P65536/D1024.
#
# Requires an image whose torch-tpu and tpu-raiden-torch were built
# against the same XLA revision: a mismatched pair segfaults in
# tpu_sync's KVCacheManager at startup. Use a DOCKER_IMAGE override if
# the default prod:latest carries a mismatch.

apiVersion: v1
kind: Service
metadata:
  name: vllm-service-prefill
  namespace: vllm-torchtpu-disagg
spec:
  selector:
    app: vllm-prefill
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service-decode
  namespace: vllm-torchtpu-disagg
spec:
  selector:
    app: vllm-decode
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: vllm-torchtpu-pd-disagg
  namespace: vllm-torchtpu-disagg
spec:
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - benchmark
  ttlSecondsAfterFinished: 300
  replicatedJobs:
    # ---------------------------------------------------------
    # PREFILL SERVER (DP1/PCP8/TP1)
    # ---------------------------------------------------------
    - name: prefill
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: vllm-prefill
            spec:
              restartPolicy: Never
              serviceAccountName: default
              dnsPolicy: ClusterFirstWithHostNet
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                      fi
                  securityContext:
                    privileged: true
                # The XLA compile cache is keyed on image sources and engine
                # config, so nightly image bumps orphan prior entries; prune
                # anything untouched for 14 days to bound PVC growth.
                - name: cache-prune
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      df -h /usr/vllm || true
                      du -sh /usr/vllm/* 2>/dev/null || true
                      # Compile-cache writes fail on a full volume, so
                      # above 90% usage wipe the caches and eat one cold
                      # compile; otherwise age entries out by mtime.
                      USE=$(df -P /usr/vllm | awk 'NR==2 {gsub("%","",$5); print $5}')
                      if [ "${USE:-0}" -gt 90 ]; then
                        echo "PVC ${USE}% full: wiping compile caches"
                        rm -rf /usr/vllm/xla_cache /usr/vllm/xla_cache_v2 /usr/vllm/vllm_cache_v2
                      else
                        for d in /usr/vllm/xla_cache /usr/vllm/xla_cache_v2 /usr/vllm/vllm_cache_v2; do
                          find "$d" -mindepth 1 -maxdepth 1 -mtime +14 -exec rm -rf {} + 2>/dev/null || true
                        done
                      fi
                      df -h /usr/vllm || true
                  volumeMounts:
                  - name: pvc-vllm-vol
                    mountPath: "/usr/vllm"
              containers:
              - name: vllm-tpu
                image: us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/vllm-torchtpu/torchtpu-vllm-prod:latest
                imagePullPolicy: IfNotPresent
                command: [ "/bin/bash", "-c", "--" ]
                args:
                  - |
                    set -e
                    # Worker core dumps are ~4GiB each and overflow the
                    # ephemeral-storage limit; the backtrace in the log is
                    # the useful artifact.
                    ulimit -c 0
                    export VLLM_HOST_IP="${POD_IP}"
                    exec vllm serve Qwen/Qwen3.5-397B-A17B-FP8 --trust-remote-code --seed=42 --max-model-len=66560 --block-size=8192 --enable-expert-parallel --disable-custom-all-reduce --gpu-memory-utilization=0.9 --kv-cache-dtype=fp8 --language-model-only --no-disable-hybrid-kv-cache-manager --attention-backend=CUSTOM --mamba-cache-mode=align --enable-prompt-tokens-details --no-enable-log-requests --no-enable-prefix-caching --no-async-scheduling --tensor-parallel-size=1 --max-num-batched-tokens=32768 --long-prefill-token-threshold=32768 --max-num-seqs=8 --prefill-context-parallel-size=8 --cp-kv-cache-interleave-size=256 --compilation-config '{"backend":"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor","compile_sizes":[1024,2048,4096,5120],"inductor_compile_config":{"enable_auto_functionalized_v2":false,"size_asserts":false,"alignment_asserts":false,"scalar_asserts":false}}' --kv-transfer-config '{"kv_connector":"TPURaidenConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_producer","kv_port":14579}'
                env:
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-token-secret
                      key: token
                - name: HF_HOME
                  value: /usr/vllm
                - name: VLLM_LOGGING_LEVEL
                  value: "INFO"
                # Raiden runtime env; kernel-selection vars deliberately
                # stay unset.
                - name: JAX_PLATFORMS
                  value: "tpu,cpu"
                - name: PJRT_DEVICE
                  value: TPU
                - name: TPU_BACKEND_TYPE
                  value: jax
                - name: VLLM_XLA_CHECK_RECOMPILATION
                  value: "0"
                - name: TPU_VLLM_SKIP_DYNAMIC_SMEM_NEGOTIATION_FLAG
                  value: "1"
                - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                  value: "1"
                - name: TPU_USE_RAIDEN_KV_CACHE_MANAGER
                  value: "1"
                - name: TPU_RAIDEN_QWEN35_ADMISSION
                  value: "1"
                - name: TPU_KV_RESHARD_TRANSPORT
                  value: "raiden"
                # Sidecar-less reshard plane: rank-0 hosts the service at
                # PORT_BASE + dp_rank, dispatch at DISPATCH_BASE + dp_rank.
                - name: TPU_RAIDEN_RESHARD_IMPL
                  value: "store"
                - name: TPU_RAIDEN_ADVERTISE_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: TPU_RAIDEN_RESHARD_PORT_BASE
                  value: "27000"
                - name: TPU_RAIDEN_STORE_DISPATCH_PORT_BASE
                  value: "27100"
                - name: TPU_RAIDEN_TRANSFER_PARALLELISM
                  value: "8"
                - name: TPU_GDN_CONV_QK_PAIR_LAYOUT
                  value: "1"
                - name: XLA_PYTHON_CLIENT_PREALLOCATE
                  value: "false"
                - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
                  value: "1"
                - name: TPU_PREMAPPED_BUFFER_SIZE
                  value: "17179869184"
                - name: TPU_P2P_WAIT_PULL_TIMEOUT
                  value: "600"
                - name: TPU_KV_SHM_POOL_GB
                  value: "8"
                - name: TPU_KV_TRANSFER_PORT
                  value: "9100"
                - name: TPU_SIDE_CHANNEL_PORT
                  value: "9600"
                - name: TORCH_TPU_INTERNAL_TIER2_COMPILATION_CACHE
                  value: "disabled"
                - name: TPU_KV_TRANSFER_NAMESPACE
                  value: "gke_prefill"
                - name: TPU_RAIDEN_JOB_NAME
                  value: "prefill"
                - name: TPU_RAIDEN_ENGINE_ID
                  value: "gke-prefill-engine"
                # GKE topology plumbing.
                - name: TPU_TOPOLOGY
                  value: "2x2x1"
                - name: TPU_HOST_BOUNDS
                  value: "1,1,1"
                - name: TPU_ACCELERATOR_TYPE
                  value: "tpu7x"
                - name: MEGASCALE_NUM_SLICES
                  value: ""
                - name: MEGASCALE_SLICE_ID
                  value: ""
                - name: TPU_PROCESS_ADDRESSES
                  value: ""
                - name: TPU_WORKER_HOSTNAMES
                  value: ""
                - name: TPU_PROCESS_PORT
                  value: ""
                - name: MEGASCALE_COORDINATOR_ADDRESS
                  value: ""
                - name: MEGASCALE_PORT
                  value: ""
                - name: RAY_LOG_TO_STDERR
                  value: "1"
                # Container startup plumbing.
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: "7200"
                - name: VLLM_XLA_CACHE_PATH
                  value: "/usr/vllm/xla_cache_v2"
                # The compile-artifact cache defaults to ~/.cache/vllm on
                # container-ephemeral storage and exceeds the 40Gi limit
                # for this model; keep it on the PVC with the XLA cache.
                - name: VLLM_CACHE_ROOT
                  value: "/usr/vllm/vllm_cache_v2"
                ports:
                - containerPort: 8000
                resources:
                  limits:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "220"
                    ephemeral-storage: "40Gi"
                  requests:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "220"
                    ephemeral-storage: "40Gi"
                volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
                - name: pvc-vllm-vol
                  mountPath: "/usr/vllm"
                securityContext:
                  privileged: true
                  capabilities:
                    add:
                    - IPC_LOCK
              volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
              - name: pvc-vllm-vol
                persistentVolumeClaim:
                  claimName: pvc-vllm-p

    # ---------------------------------------------------------
    # DECODE SERVER (TP1/DP8/EP8)
    # ---------------------------------------------------------
    - name: decode
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: vllm-decode
            spec:
              restartPolicy: Never
              serviceAccountName: default
              dnsPolicy: ClusterFirstWithHostNet
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                      fi
                  securityContext:
                    privileged: true
                # The XLA compile cache is keyed on image sources and engine
                # config, so nightly image bumps orphan prior entries; prune
                # anything untouched for 14 days to bound PVC growth.
                - name: cache-prune
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      df -h /usr/vllm || true
                      du -sh /usr/vllm/* 2>/dev/null || true
                      # Compile-cache writes fail on a full volume, so
                      # above 90% usage wipe the caches and eat one cold
                      # compile; otherwise age entries out by mtime.
                      USE=$(df -P /usr/vllm | awk 'NR==2 {gsub("%","",$5); print $5}')
                      if [ "${USE:-0}" -gt 90 ]; then
                        echo "PVC ${USE}% full: wiping compile caches"
                        rm -rf /usr/vllm/xla_cache /usr/vllm/xla_cache_v2 /usr/vllm/vllm_cache_v2
                      else
                        for d in /usr/vllm/xla_cache /usr/vllm/xla_cache_v2 /usr/vllm/vllm_cache_v2; do
                          find "$d" -mindepth 1 -maxdepth 1 -mtime +14 -exec rm -rf {} + 2>/dev/null || true
                        done
                      fi
                      df -h /usr/vllm || true
                  volumeMounts:
                  - name: pvc-vllm-vol
                    mountPath: "/usr/vllm"
              containers:
              - name: vllm-tpu
                image: us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/vllm-torchtpu/torchtpu-vllm-prod:latest
                imagePullPolicy: IfNotPresent
                command: [ "/bin/bash", "-c", "--" ]
                args:
                  - |
                    set -e
                    # Worker core dumps are ~4GiB each and overflow the
                    # ephemeral-storage limit; the backtrace in the log is
                    # the useful artifact.
                    ulimit -c 0
                    export VLLM_HOST_IP="${POD_IP}"
                    exec vllm serve Qwen/Qwen3.5-397B-A17B-FP8 --trust-remote-code --seed=42 --max-model-len=66560 --block-size=8192 --enable-expert-parallel --disable-custom-all-reduce --gpu-memory-utilization=0.9 --kv-cache-dtype=fp8 --language-model-only --no-disable-hybrid-kv-cache-manager --attention-backend=CUSTOM --mamba-cache-mode=align --enable-prompt-tokens-details --no-enable-log-requests --no-enable-prefix-caching --no-async-scheduling --tensor-parallel-size=1 --max-num-batched-tokens=4384 --max-num-seqs=32 --prefill-context-parallel-size=1 --data-parallel-size=8 --data-parallel-size-local=8 --compilation-config '{"backend":"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor","compile_sizes":[8,16,32,4352,4384],"inductor_compile_config":{"enable_auto_functionalized_v2":false,"size_asserts":false,"alignment_asserts":false,"scalar_asserts":false}}' --kv-transfer-config '{"kv_connector":"TPURaidenConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector","kv_role":"kv_consumer","kv_port":14579}'
                env:
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-token-secret
                      key: token
                - name: HF_HOME
                  value: /usr/vllm
                - name: VLLM_LOGGING_LEVEL
                  value: "INFO"
                # Raiden runtime env; kernel-selection vars deliberately
                # stay unset.
                - name: JAX_PLATFORMS
                  value: "tpu,cpu"
                - name: PJRT_DEVICE
                  value: TPU
                - name: TPU_BACKEND_TYPE
                  value: jax
                - name: VLLM_XLA_CHECK_RECOMPILATION
                  value: "0"
                - name: TPU_VLLM_SKIP_DYNAMIC_SMEM_NEGOTIATION_FLAG
                  value: "1"
                - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                  value: "1"
                - name: TPU_USE_RAIDEN_KV_CACHE_MANAGER
                  value: "1"
                - name: TPU_RAIDEN_QWEN35_ADMISSION
                  value: "1"
                - name: TPU_KV_RESHARD_TRANSPORT
                  value: "raiden"
                # Sidecar-less reshard plane; DP8, so ranks 0-7 bind
                # 28000-28007 (service) and 28100-28107 (dispatch).
                - name: TPU_RAIDEN_RESHARD_IMPL
                  value: "store"
                - name: TPU_RAIDEN_ADVERTISE_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: TPU_RAIDEN_RESHARD_PORT_BASE
                  value: "28000"
                - name: TPU_RAIDEN_STORE_DISPATCH_PORT_BASE
                  value: "28100"
                - name: TPU_RAIDEN_TRANSFER_PARALLELISM
                  value: "8"
                - name: TPU_GDN_CONV_QK_PAIR_LAYOUT
                  value: "1"
                - name: XLA_PYTHON_CLIENT_PREALLOCATE
                  value: "false"
                - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
                  value: "1"
                - name: TPU_PREMAPPED_BUFFER_SIZE
                  value: "17179869184"
                - name: TPU_P2P_WAIT_PULL_TIMEOUT
                  value: "600"
                - name: TPU_KV_SHM_POOL_GB
                  value: "8"
                - name: TPU_KV_TRANSFER_PORT
                  value: "9100"
                - name: TPU_SIDE_CHANNEL_PORT
                  value: "9600"
                - name: TORCH_TPU_INTERNAL_TIER2_COMPILATION_CACHE
