                resources:
                  limits:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "220"
                    ephemeral-storage: "40Gi"
                  requests:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "220"
                    ephemeral-storage: "40Gi"
                volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
                - name: pvc-vllm-vol
