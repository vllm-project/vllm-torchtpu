apiVersion: v1
kind: Service
metadata:
  name: vllm-service-prefill
  namespace: vllm-torchtpu-disagg
spec:
  selector:
    app: vllm-prefill
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service-decode
  namespace: vllm-torchtpu-disagg
spec:
  selector:
    app: vllm-decode
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: vllm-torchtpu-pd-disagg
  namespace: vllm-torchtpu-disagg
spec:
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - benchmark
  ttlSecondsAfterFinished: 300
  replicatedJobs:
    # ---------------------------------------------------------
    # PREFILL SERVER
    # ---------------------------------------------------------
    - name: prefill
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: vllm-prefill
            spec:
              restartPolicy: Never
              serviceAccountName: default
              dnsPolicy: ClusterFirstWithHostNet
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
                      fi
                  securityContext:
                    privileged: true
                # The XLA compile cache is keyed on image sources and engine
                # config, so nightly image bumps orphan prior entries; prune
                # anything untouched for 14 days to bound PVC growth.
                - name: cache-prune
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      find /usr/vllm/xla_cache -mindepth 1 -maxdepth 1 -atime +14 -exec rm -rf {} + 2>/dev/null || true
                      df -h /usr/vllm || true
                  volumeMounts:
                  - name: pvc-vllm-vol
                    mountPath: "/usr/vllm"
              containers:
              - name: vllm-tpu
                image: us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/vllm-torchtpu/torchtpu-vllm-prod:latest
                imagePullPolicy: IfNotPresent
                command: [ "/bin/bash", "-c", "--" ]
                args: ["vllm serve --seed=42 --model=Qwen/Qwen3.5-397B-A17B-FP8 --trust-remote-code --max-model-len=10240 --max-num-batched-tokens=8192 --max-num-seqs=512 --no-enable-prefix-caching --tensor-parallel-size=8 --enable-expert-parallel --quantization=fp8 --kv-cache-dtype=fp8 --gpu-memory-utilization=0.70 --no-async-scheduling --disable-log-stats --language-model-only --attention-backend=FLASH_ATTN --mamba-cache-mode=align --no-disable-hybrid-kv-cache-manager --kv-transfer-config '{\"kv_connector\":\"TPUConnector\",\"kv_connector_module_path\":\"vllm_torchtpu.distributed.kv_transfer.tpu_connector\",\"kv_role\":\"kv_producer\",\"kv_connector_extra_config\":{\"use_hma_connector\":true}}'"]
                env:
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-token-secret
                      key: token
                - name: HF_HOME
                  value: /usr/vllm
                - name: VLLM_LOGGING_LEVEL
                  value: "INFO"
                - name: JAX_PLATFORMS
                  value: "tpu,cpu"
                - name: TPU_BACKEND_TYPE
                  value: jax
                - name: PJRT_DEVICE
                  value: TPU
                - name: USE_MOE_EP_KERNEL
                  value: "0"
                - name: MODEL_IMPL_TYPE
                  value: "vllm"
                - name: USE_BATCHED_RPA_KERNEL
                  value: "0"
                - name: TPU_TOPOLOGY
                  value: "2x2x1"
                - name: TPU_HOST_BOUNDS
                  value: "1,1,1"
                - name: MEGASCALE_NUM_SLICES
                  value: ""
                - name: MEGASCALE_SLICE_ID
                  value: ""
                - name: TPU_PROCESS_ADDRESSES
                  value: ""
                - name: TPU_WORKER_HOSTNAMES
                  value: ""
                - name: TPU_PROCESS_PORT
                  value: ""
                - name: MEGASCALE_COORDINATOR_ADDRESS
                  value: ""
                - name: MEGASCALE_PORT
                  value: ""
                - name: RAY_LOG_TO_STDERR
                  value: "1"
                - name: TPU_KV_PIN_SHM
                  value: "1"
                - name: USE_MOE_SPARSE_CORE
                  value: "1"
                - name: ONEHOT_MOE_PERMUTE_THRESHOLD
                  value: "32768"
                - name: RAGGED_GATED_DELTA_RULE_IMPL
                  value: "chunked_kernel_v3_pd"
                - name: TPU_ACCELERATOR_TYPE
                  value: "tpu7x"
                # v1 HMA connector requires the typed per-layer KV layout;
                # the unified pool exposes GDN layers as [pool] which it
                # cannot register (only TPUConnectorV2 needs the unified pool).
                - name: TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL
                  value: "0"
                - name: TPU_ENABLE_D2H_TRANSFER
                  value: "1"
                - name: TPU_HMA_D2H_COPY_IMPL
                  value: "device_put"
                - name: TPU_HMA_MIN_DONE_RECVING_BATCH
                  value: "1"
                - name: TPU_HMA_MAX_DONE_RECVING_BATCH
                  value: "1"
                - name: TPU_HMA_MAX_INFLIGHT_D2H_SENDS
                  value: "1"
                - name: TPU_HMA_MAX_INFLIGHT_PULLS
                  value: "8"
                - name: TPU_MAX_HOST_KV_BUFFER_SIZE
                  value: "64"
                - name: TPU_P2P_WAIT_PULL_TIMEOUT
                  value: "600"
                - name: TPU_KV_SHM_POOL_GB
                  value: "16"
                - name: TPU_KV_TRANSFER_PORT
                  value: "9100"
                - name: TPU_SIDE_CHANNEL_PORT
                  value: "9600"
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: "7200"
                - name: VLLM_XLA_CACHE_PATH
                  value: "/usr/vllm/xla_cache_v2"
                - name: TPU_PREMAPPED_BUFFER_SIZE
                  value: "8589934592"
                - name: TPU_PREMAPPED_BUFFER_TRANSFER_THRESHOLD_BYTES
                  value: "8589934592"
                ports:
                - containerPort: 8000
                resources:
                  limits:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "220"
                    ephemeral-storage: "40Gi"
                  requests:
                    google.com/tpu: "4"
                    memory: "850Gi"
                    cpu: "220"
                    ephemeral-storage: "40Gi"
                volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
                - name: pvc-vllm-vol
                  mountPath: "/usr/vllm"
                securityContext:
                  privileged: true
                  capabilities:
                    add:
                    - IPC_LOCK
              volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
              - name: pvc-vllm-vol
                persistentVolumeClaim:
                  claimName: pvc-vllm-p

    # ---------------------------------------------------------
    # DECODE SERVER
    # ---------------------------------------------------------
    - name: decode
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: vllm-decode
            spec:
              restartPolicy: Never
              serviceAccountName: default
              dnsPolicy: ClusterFirstWithHostNet
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              initContainers:
                - name: tpu-node-setup
                  image: busybox
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sysctl -w vm.max_map_count=8388608
                      if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                        echo 2000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit
