                - name: TPU_KV_TRANSFER_NAMESPACE
                  value: "gke_decode"
                - name: TPU_RAIDEN_JOB_NAME
                  value: "decode"
                - name: TPU_RAIDEN_ENGINE_ID
                  value: "gke-decode-engine"
                # GKE topology plumbing.
