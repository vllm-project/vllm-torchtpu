# Intended differences between today's kube scripts and the scenarios' plans.
#
# Each entry accepts the differences it matches: scenario (one or a list),
# point (optional; any point when absent), where and name (shell globs), kind,
# and the today and plan values ("*" is any value, null is absent). Every entry
# needs a reason and has to match at least one difference, so a fixed script
# removes its entry too. A failing case prints the entry that would accept
# each new difference.

# Serve flags -------------------------------------------------------------------

- scenario: qwen3-0.6b/tp1
  where: serve server/0
  kind: flag
  name: --served-model-name
  today: null
  plan: Qwen/Qwen3-0.6B
  reason: >-
    model.name is always --served-model-name (R-SCH-7). It equals the model
    here, which is vLLM's default name.

- scenario: qwen3.5-397b/fp8-pcp8-dp8-1p1d
