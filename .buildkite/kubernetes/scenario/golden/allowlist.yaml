# AgentX client -----------------------------------------------------------------

- scenario: kimi-k3/agentx-1p1d
  where: agentx *
  kind: command
  name: program
  today: bash scripts/vllm/benchmark/inferencex/agentx_client.sh
  plan: /opt/infx/runtime/venv/bin/python -m infx.bench agentic
  reason: >-
    The scenario's AgentX client is InferenceX's own infx.bench, baked into
    the image at a pinned commit (P-21, M2b); agentx_client.sh drives the
    older benchmark_lib.sh. The values both take compare through
    agentx_client.sh's flags below.

- scenario: kimi-k3/agentx-1p1d
  where: agentx *
  kind: flag
  name: --conc-list
  today: "1,4"
  plan: "*"
  reason: >-
    One point per server instead of a ladder on one pair (PLAN.md 9.1.1):
    InferenceX requires one concurrency per server deployment, so each point
    boots its own pair.

- scenario: kimi-k3/agentx-1p1d
  where: agentx *
  kind: flag
  name: --gsm8k-conc
  today: "4"
  plan: null
  reason: >-
    An AgentX point runs AgentX alone (V-34), so the GSM8K probe is the
    scenario's gsm8k point instead: InferenceX's eval client alone on a fresh
    pair (V-43), which the golden check skips (golden_cases.py). The 1P1D
    correctness pair gates MMLU-Pro through the proxy every night.

- scenario: kimi-k3/agentx-1p1d
  where: agentx *
  kind: flag
  name: --engine-url
  today: http://wl-decode-0-0.wl:8000
  plan: null
  reason: >-
    agentx_client.sh reads the decode engine's /metrics to wait for a drain
    between ladder points and after the GSM8K probe, and to log preemptions.
    A point on a fresh pair with no probe has nothing to drain.

- scenario: kimi-k3/agentx-1p1d
  where: agentx *
  kind: flag
  name: --duration
  today: null
  plan: "1200"
  reason: &agentx-fast >-
    agentx_client.sh defaults to --fast 1 and --duration 1800. Fast mode runs
    InferenceX's fixed 20 minute window instead of the duration, which the
    scenario states as fast with a 20m duration. The per-point timeout is
    the same 1h45m (3600 + 1800 + 900 s).

- scenario: kimi-k3/agentx-1p1d
  where: agentx *
  kind: flag
  name: --fast
  today: null
  plan: "1"
  reason: *agentx-fast

- scenario: kimi-k3/agentx-1p1d
  where: agentx *
  kind: flag
  name: --label
  today: agentx_kimi-k3-tp8-dp4-ep-agentx
  plan: agentx
  reason: >-
    The result file is agentx_c<N> (P-21); today's adds the config name. The
    row is filed under MODEL_PREFIX and PRECISION, which match.

