# kimi-k3/tp8-dp4-ep-1p1d points: -
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: '${WORKLOAD_NAME}'
  annotations:
    tpu-ci.google.com/defaults: standard
spec:
  network:
    enableDNSHostnames: true
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - prefill
  replicatedJobs:
    - name: prefill
      groupName: prefill
      replicas: 1
      template:
        metadata:
          annotations:
            alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
        spec:
          parallelism: 4
          completions: 4
          completionMode: Indexed
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: '2x2x4'
              tolerations:
                - key: google.com/tpu
                  operator: Equal
                  value: present
                  effect: NoSchedule
              containers:
                - name: workload
                  image: '${IMAGE}'
                  command:
                    - scenario
                    - run
                    - '--role'
                    - prefill
                  ports:
                    - containerPort: 8000
                    - containerPort: 8100
                    - containerPort: 8090
                  resources:
                    limits:
                      google.com/tpu: '4'
                    requests:
                      google.com/tpu: '4'
                  env:
                    - name: SCENARIO_PLAN
                      value: <SCENARIO_PLAN>
                    - name: SCENARIO_RESOLVED
                      value: <SCENARIO_RESOLVED>
                    - name: SCENARIO_HOST_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
                    - name: SCENARIO_ADVERTISE_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: SCENARIO_HEAD_ADDRESS
                      value: '${WORKLOAD_NAME}-prefill-0-0.${WORKLOAD_NAME}'
                    - name: SCENARIO_ROLE_HOSTS
                      value: '{"prefill":["${WORKLOAD_NAME}-prefill-0-0.${WORKLOAD_NAME}","${WORKLOAD_NAME}-prefill-0-1.${WORKLOAD_NAME}","${WORKLOAD_NAME}-prefill-0-2.${WORKLOAD_NAME}","${WORKLOAD_NAME}-prefill-0-3.${WORKLOAD_NAME}"],"decode":["${WORKLOAD_NAME}-decode-0-0.${WORKLOAD_NAME}","${WORKLOAD_NAME}-decode-0-1.${WORKLOAD_NAME}","${WORKLOAD_NAME}-decode-0-2.${WORKLOAD_NAME}","${WORKLOAD_NAME}-decode-0-3.${WORKLOAD_NAME}"]}'
                    - name: SCENARIO_IMAGE
                      value: '${IMAGE}'
                    - name: SCENARIO_TARGET_DATA
                      value: <SCENARIO_TARGET_DATA>
                    - name: VLLM_CACHE_ROOT
                      value: /cache/jax/vllm
                    - name: VLLM_XLA_CACHE_PATH
                      value: /cache/jax/xla
                    - name: HF_DATASETS_CACHE
                      value: /cache/hf/hub/datasets
                    - name: TMPDIR
                      value: /dev/shm
                    - name: RAY_TMPDIR
                      value: /tmp
                    - name: FORCE_COLOR
                      value: '1'
                    - name: TQDM_MININTERVAL
                      value: '30'
                  volumeMounts:
                    - name: vllm-profile-cache
                      mountPath: /cache/jax/vllm/profile_cache
              volumes:
                - name: vllm-profile-cache
                  emptyDir:
                    medium: Memory
                    sizeLimit: '16Gi'
    - name: decode
      groupName: decode
      replicas: 1
      template:
        metadata:
          annotations:
            alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
        spec:
          parallelism: 4
          completions: 4
          completionMode: Indexed
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: '2x2x4'
              tolerations:
                - key: google.com/tpu
                  operator: Equal
                  value: present
                  effect: NoSchedule
              containers:
                - name: workload
                  image: '${IMAGE}'
                  command:
                    - scenario
                    - run
                    - '--role'
                    - decode
                  ports:
                    - containerPort: 8000
                  resources:
                    limits:
                      google.com/tpu: '4'
                    requests:
                      google.com/tpu: '4'
                  env:
                    - name: SCENARIO_PLAN
                      value: <SCENARIO_PLAN>
                    - name: SCENARIO_HOST_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"
                    - name: SCENARIO_ADVERTISE_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: SCENARIO_HEAD_ADDRESS
                      value: '${WORKLOAD_NAME}-decode-0-0.${WORKLOAD_NAME}'
                    - name: SCENARIO_ROLE_HOSTS
                      value: '{"prefill":["${WORKLOAD_NAME}-prefill-0-0.${WORKLOAD_NAME}","${WORKLOAD_NAME}-prefill-0-1.${WORKLOAD_NAME}","${WORKLOAD_NAME}-prefill-0-2.${WORKLOAD_NAME}","${WORKLOAD_NAME}-prefill-0-3.${WORKLOAD_NAME}"],"decode":["${WORKLOAD_NAME}-decode-0-0.${WORKLOAD_NAME}","${WORKLOAD_NAME}-decode-0-1.${WORKLOAD_NAME}","${WORKLOAD_NAME}-decode-0-2.${WORKLOAD_NAME}","${WORKLOAD_NAME}-decode-0-3.${WORKLOAD_NAME}"]}'
                    - name: SCENARIO_IMAGE
                      value: '${IMAGE}'
                    - name: VLLM_CACHE_ROOT
                      value: /cache/jax/vllm
                    - name: VLLM_XLA_CACHE_PATH
                      value: /cache/jax/xla
                    - name: HF_DATASETS_CACHE
                      value: /cache/hf/hub/datasets
                    - name: TMPDIR
                      value: /dev/shm
                    - name: RAY_TMPDIR
                      value: /tmp
                    - name: FORCE_COLOR
                      value: '1'
                    - name: TQDM_MININTERVAL
                      value: '30'
                  volumeMounts:
                    - name: vllm-profile-cache
                      mountPath: /cache/jax/vllm/profile_cache
              volumes:
                - name: vllm-profile-cache
                  emptyDir:
                    medium: Memory
                    sizeLimit: '16Gi'
