steps:
  - label: ":docker: TEST ONLY - Build Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":test_tube: TEST ONLY - BufferFromHostBuffer (TPU v7x-8)"
    key: buffer_from_host_singlehost
    depends_on: build_docker
    timeout_in_minutes: 20
    agents:
      queue: tpu_v7x_8_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh \
          env -u TPU_PREMAPPED_BUFFER_SIZE \
          bash ./scripts/run_singlehost_buffer_from_host.sh \
          /perf_eval_results/buffer_from_host 100 10
    artifact_paths:
      - "perf_eval_results/**/*"
