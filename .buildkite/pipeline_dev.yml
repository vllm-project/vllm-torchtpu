# Dev pipeline for vllm-torchtpu-dev.
# Demo/sample steps showing how to run one-off experiments on TPU.
# Copy and adapt any step below for your own test.
#
# WHY THIS EXISTS
# ───────────────
# vllm-torchtpu-ci runs the full suite (~build + unit tests + integration +
# perf) on every push, which is slow and shared. This pipeline uploads ONLY the
# steps on YOUR branch, so a single test costs one image build + one job.
#
# HOW TO TRIGGER
# ──────────────
# Option A — Buildkite UI:
#   https://buildkite.com/vllm/vllm-torchtpu-dev → "New Build",
#   set branch to your branch, "Create Build".
#
# Option B — Buildkite API (needs BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/vllm/pipelines/vllm-torchtpu-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"
#
# HOW TO CUSTOMIZE
# ────────────────
# 1. On your branch, edit this file — start from whichever demo is closest.
# 2. Delete the steps you don't need (each one costs a TPU slot).
# 3. Trigger the pipeline — only your branch's copy of this file is used, so
#    you can leave it modified indefinitely without affecting anyone else.
#
# NOTES
# ─────
# * The build step tags the image with $BUILDKITE_COMMIT and every TPU step
#   pulls that exact tag, so all steps must depend_on `build_docker`.
# * run_in_docker.sh runs your command inside the image at
#   /workspace/vllm-torchtpu — that is a COPY of the repo at this commit, not the
#   agent's checkout. Reference paths like `examples/...` / `tests/...`
#   relative to the repo root.
# * Anything written to /perf_eval_results inside the container is copied back
#   out and uploaded as a Buildkite artifact.
#
# LANES
# ─────
# A build that sets K3_PD_CONFIG runs the Kimi-K3 megakernel AgentX lane at the
# end of this file, and none of the demos.

steps:

  # -----------------------------------------------------------------
  # Build step (required by every demo below)
  # Builds docker/Dockerfile --target dev and pushes it tagged with this
  # commit. Same script the CI pipeline_build.yml uses.
  # -----------------------------------------------------------------
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh
    # The torch-tpu virtual registry sometimes 404s a wheel it serves moments
    # later, and a build that fails that way passes on a later try. Twice
    # rather than pipeline_build.yml's once: a failed image build here fails
    # the whole run, Kimi-K3 pair included.
    retry: &image_build_retry
      automatic:
        - exit_status: 1
          limit: 2

  # -----------------------------------------------------------------
  # Demo 1: offline_inference.py
  # The simplest pattern — run a Python script inside the image.
  # Starting point for any offline batch-inference experiment.
  # -----------------------------------------------------------------
  - label: "[demo] offline_inference.py (Qwen3-0.6B)"
    key: demo_offline_inference
    if: 'build.env("K3_PD_CONFIG") == null'
    depends_on: build_docker
    agents:
      queue: tpu_v7x_2_queue
    commands:
      - |
        # Customize --model / --max-model-len / --max-tokens as needed.
        # Add --tensor_parallel_size=N for TP/EP runs, and move the step to
        # tpu_v7x_8_queue / tpu_v7x_16_queue when it needs more than 2 chips.
        .buildkite/scripts/run_in_docker.sh bash -c '
          python3 examples/offline_inference.py \
            --model Qwen/Qwen3-0.6B \
            --max-model-len 256 \
            --max-num-batched-tokens 256 \
            --max-tokens 32'

  # -----------------------------------------------------------------
  # Demo 2: run one specific unit test
  # The fastest way to iterate on a single test instead of waiting for the
  # full "Unit Tests - General (PR)" job in CI.
  # -----------------------------------------------------------------
  - label: "[demo] pytest one file"
    key: demo_pytest
    if: 'build.env("K3_PD_CONFIG") == null'
    depends_on: build_docker
    agents:
      queue: tpu_v7x_2_queue
    commands:
      - |
        # Swap in your own file / -k selector. `-m 'not nightly'` mirrors what
        # CI runs on PRs; drop it to include nightly-marked tests.
        .buildkite/scripts/run_in_docker.sh bash -c '
          pytest -sv --timeout=600 -m "not nightly" \
            tests/runner/test_tpu_runner.py'

  # -----------------------------------------------------------------
  # Demo 3: repeat a test N times (flake hunting / A-B rate comparison)
  # Use Buildkite's matrix instead of copy-pasting the step N times —
  # {{matrix}} interpolates into the label so each parallel job is uniquely
  # named. To prove "commit X caused a flake", run this at X and at X^ and
  # compare the pass RATES, not a single run.
  # -----------------------------------------------------------------
  - label: "[demo] stress: pytest one file (run {{matrix}})"
    key: demo_stress
    if: 'build.env("K3_PD_CONFIG") == null'
    depends_on: build_docker
    agents:
      queue: tpu_v7x_2_queue
    matrix: ["1", "2", "3", "4", "5"]
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c '
          pytest -sv --timeout=600 -m "not nightly" \
            tests/runner/test_tpu_runner.py'

  # -----------------------------------------------------------------
  # Kimi-K3 megakernel AgentX, on a build that sets K3_PD_CONFIG
  # One recipe point of the "Kimi-K3 on TPU7x: 1P1D prefill/decode recipes"
  # doc (configs/kimi-k3-megakernel/) on the AgentX 1P1D pair
  # (kimi-k3-agentx-1p1d.yaml) - TP32 per role on two tpu7x 2x2x4 slices,
  # served with --nnodes by k3_1p1d.sh - replayed by the pair's client through
  # vllm-router. The engines run an image built from another branch; the
  # client and the pair's scripts come from this build's commit. Build env:
  #   K3_PD_CONFIG     the point: kimi-k3-megakernel/p1-c1 ...
  #                    kimi-k3-megakernel/p7-c16 (p6, p7 experimental), or a
  #                    pruned point of the doc's Oct 13 set,
  #                    kimi-k3-megakernel-1013/a-c1 ... kimi-k3-megakernel-1013/h-c48
  #   K3_ENGINE_REF    the ref of this repository the engine image is built
  #                    from: a branch name, a tag, a full 40-character commit
  #                    SHA (not a short one, which cannot be fetched) or
  #                    refs/pull/<N>/head; default
  #                    inferact/megakernel-integration-1015
  #   K3_ENGINE_IMAGE  an engine image to use as it is, instead of building one
  # One point per build, since each needs its own decode server. Point 1 took
  # ~45 min from admission. The step passes even when every request fails,
  # because the client exits 0 after writing what it has: read "requests ok"
  # in summary.md.
  # -----------------------------------------------------------------
  # Publishes K3_ENGINE_IMAGE, which common.sh hands the manifest.
  - label: ":docker: Build Kimi-K3 megakernel engine image"
    key: k3_engine_image
    if: 'build.env("K3_PD_CONFIG") != null'
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/build_k3_engine_image.sh
    retry: *image_build_retry

  - label: ":kubernetes: :tpu: Perf: Kimi-K3 AgentX 1P1D ${K3_PD_CONFIG} (TPU v7x 2x2x4 x2)"
    key: k3_mk_agentx_1p1d
    if: 'build.env("K3_PD_CONFIG") != null'
    depends_on:
      - build_docker
      - k3_engine_image
    # No concurrency group, so two pairs can run at once on the four 2x2x4
    # slice pools. Kueue admits a pair's 32 chips together and JobSet gives
    # each role a slice of its own, so two pairs cannot split slices. A second
    # pair borrows 32 chips from the tpu7x cohort when they are idle (the
    # lending queues never reclaim) and otherwise waits in Kueue, for up to the
    # launcher's queue_max_seconds. The nightly pairs in pipeline_perf_kube.yml
    # keep their group, so they still run one at a time among themselves.
    timeout_in_minutes: 1440
    env:
      # The kube launcher uploads whatever the workload leaves here as the
      # step's artifacts, as pipeline_perf_kube.yml declares it.
      ARTIFACTS_DIR: "perf_eval_results"
      # bootstrap_dev.sh leaves its builds unclassed: Kueue priority 0, ahead of
      # the nightlies and behind every other kind of build. post-merge queues
      # this one with main, and it preempts: the 2x2x4 ClusterQueue reclaims
      # within its cohort from LowerPriority workloads, so the quota it lends to
      # other tpu7x shapes is taken back by evicting their jobs (Kueue requeues
      # them).
      WORKLOAD_PRIORITY: "post-merge"
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      # A misspelt point fails here rather than in eight pods after admission.
      - |
        test -f "scripts/vllm/benchmarking/configs/$${K3_PD_CONFIG}.sh" \
          || { echo "no such config: $${K3_PD_CONFIG}" >&2; exit 2; }
      - .buildkite/kubernetes/run_multihost.sh --manifest kimi-k3-agentx-1p1d.yaml
