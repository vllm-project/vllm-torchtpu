# PROTOTYPE (experiment/selector-prototype, not for merging): records what CI
# steps run, for the diff-aware selector prototype.
#
# Trigger: https://buildkite.com/vllm/vllm-torchtpu-dev -> "New Build", branch
# experiment/selector-prototype. Each recording step uploads its recordings
# under selector_recordings/fnrec/<step>/shard<N>/.
#
# Round 1 (build #1449) recorded unit_tests_cpu_pr and unit_tests_general_pr.
# Round 2 records two integration steps (Kimi-K3 and compilation cache), with
# the same command, shape and env as pipeline_integration.yml.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh
    retry:
      automatic:
        - exit_status: 1
          limit: 2

  # Kimi-K3 first, as suggested in review. Same command and env as CI; the
  # checkpoint (~443 GiB) streams from GCS, so the boot is long.
  - label: "[prototype] record integration_k3_pruned75_apc_offload_correctness"
    key: record_k3
    depends_on: build_docker
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    env:
      SHAPE: "tpu7x-standard-4t/2x2x1"
      TPU_ACCELERATOR_TYPE: "tpu7x"
      RUN_ROOT: "perf_eval_results/k3_pruned75_apc_offload_ci"
      SERVED_MODEL_NAME: "mgoin/Kimi-K3-pruned75"
      ARTIFACTS_DIR: "selector_recordings"
    commands:
      - >-
        .buildkite/kubernetes/run.sh bash
        .buildkite/scripts/selector_prototype/record_script.sh
        integration_k3_pruned75_apc_offload_correctness "$${BUILDKITE_COMMIT}"

  # No automatic retry, unlike CI: two attempts would upload the same
  # recording paths. Rerun the build if its known cache flake hits.
  - label: "[prototype] record integration_compilation_cache_e2e"
    key: record_compilation_cache
    depends_on: build_docker
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    env:
      SHAPE: "tpu7x-standard-1t/1x1x1"
      ARTIFACTS_DIR: "selector_recordings"
    commands:
      - >-
        .buildkite/kubernetes/run.sh bash
        .buildkite/scripts/selector_prototype/record_script.sh
        integration_compilation_cache_e2e "$${BUILDKITE_COMMIT}"
