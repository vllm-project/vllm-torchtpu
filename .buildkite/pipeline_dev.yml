# PROTOTYPE (experiment/selector-prototype, not for merging): records what two
# CI steps run, for the diff-aware selector prototype.
#
# Trigger: https://buildkite.com/vllm/vllm-torchtpu-dev -> "New Build", branch
# experiment/selector-prototype. Each recording step uploads its shard's
# recordings under selector_recordings/fnrec/<step>/shard<N>/.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh
    retry:
      automatic:
        - exit_status: 1
          limit: 2

  # Same marker filter and files as Unit Tests - CPU (PR), on the cpu queue.
  - label: "[prototype] record unit_tests_cpu_pr (shard {{matrix}})"
    key: record_cpu
    depends_on: build_docker
    timeout_in_minutes: 120
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    matrix: ["0", "1", "2"]
    env:
      SHAPE: "cpu"
      JAX_PLATFORMS: "cpu"
      ARTIFACTS_DIR: "selector_recordings"
    commands:
      - >-
        .buildkite/kubernetes/run.sh bash
        .buildkite/scripts/selector_prototype/record_step.sh
        unit_tests_cpu_pr {{matrix}} 3 "$${BUILDKITE_COMMIT}"
        "not tpu_test and not multichip and not nightly"

  # Same marker filter and files as Unit Tests - General (PR): one v7x chip
  # per shard, three shards, as in CI.
  - label: "[prototype] record unit_tests_general_pr (shard {{matrix}})"
    key: record_tpu_general
    depends_on: build_docker
    # Covers queueing too, as in pipeline_tests.yml.
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    matrix: ["0", "1", "2"]
    env:
      SHAPE: "tpu7x-standard-1t/1x1x1"
      ARTIFACTS_DIR: "selector_recordings"
    commands:
      - >-
        .buildkite/kubernetes/run.sh bash
        .buildkite/scripts/selector_prototype/record_step.sh
        unit_tests_general_pr {{matrix}} 3 "$${BUILDKITE_COMMIT}"
        "tpu_test and not nightly and not multichip"
        tests/entrypoints/llm/test_speculative_decoding.py
