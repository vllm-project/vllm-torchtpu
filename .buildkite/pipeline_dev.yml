# Throwaway: measures offloaded blocks per K3-pruned75 prompt for the
# tier-1 eviction nightly step. Not for merge.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh
    retry:
      automatic:
        - exit_status: 1
          limit: 2

  - label: "k3-pruned75 probe: offloaded blocks per prompt"
    key: k3_offload_blocks_probe
    depends_on: build_docker
    timeout_in_minutes: 300
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    env:
      SHAPE: "tpu7x-standard-4t/2x2x1"
      TPU_ACCELERATOR_TYPE: "tpu7x"
      ARTIFACTS_DIR: "perf_eval_results"
      RUN_ROOT: "perf_eval_results/k3_offload_blocks_probe"
      SERVED_MODEL_NAME: "mgoin/Kimi-K3-pruned75"
    commands:
      - .buildkite/kubernetes/run.sh bash ./scripts/vllm/integration/diag_k3_offload_blocks.sh
