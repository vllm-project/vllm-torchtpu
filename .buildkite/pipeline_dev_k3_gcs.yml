# Kimi-K3 on the tpu7x-32 pod, loaded DIRECTLY FROM GCS with EP-sharded
# Run:AI streaming (model_loader_patches.py). Select with
# DEV_PIPELINE_FILE=.buildkite/pipeline_dev_k3_gcs.yml.
#
# This is the no-local-disk path: --enable-ep-weight-filter makes each rank
# request only its own experts' byte ranges (28/896 at EP32) plus dense
# weights, so host-resident anonymous memory stays near the MoE CPU scratch
# (~360 GB/host) instead of the >1 TB that full-checkpoint streaming
# accumulated (Ray OOM kills in builds 82/83/85). The local-disk recipe in
# pipeline_dev_k3.yml (build 153) remains the fallback.

steps:
  - label: ":docker: Build and Push Dev Image"
    key: build_docker
    agents:
      queue: cpu_64_core
    commands:
      - bash .buildkite/scripts/setup_docker_env.sh

  - label: ":rocket: tpu7x-32 multi-host Kimi-K3 8k/1k bs=1 (GCS, EP-sharded stream)"
    key: tpu7x_32_k3_gcs
    depends_on: build_docker
    timeout_in_minutes: 420
    agents:
      queue: tpu_v7x_32_queue
    env:
      # Budget for stream + cold XLA compile.
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      # The CI image sets this to 1, making any compile at request time fatal.
      # The bench serves shapes the warmup sweep does not cover.
      VLLM_XLA_CHECK_RECOMPILATION: "0"
    commands:
      - |
        .buildkite/scripts/run_multihost.sh \
          "vllm serve gs://tpu-commons-ci/moonshootai/kimi/k3 \
            --served-model-name moonshotai/Kimi-K3 \
            --port 8000 \
            --tensor-parallel-size 32 \
            --enable-expert-parallel \
            --enable-ep-weight-filter \
            --max-model-len 9216 \
            --max-num-batched-tokens 512 \
            --max-num-seqs 1 \
            --compilation-config '{\"compile_sizes\":[16,64,256,512]}' \
            --model-loader-extra-config '{\"memory_limit\":17179869184}' \
            --attention-backend CUSTOM \
            --trust-remote-code \
            --language-model-only \
            --limit-mm-per-prompt '{\"image\":0,\"video\":0}' \
            --no-enable-prefix-caching \
            --no-async-scheduling \
            --load-format runai_streamer \
            --gpu-memory-utilization 0.7" \
          "python3 .buildkite/scripts/stage_tokenizer.py \
             gs://tpu-commons-ci/moonshootai/kimi/k3 /tmp/tok \
           && vllm bench serve \
            --host 127.0.0.1 --port 8000 \
            --model moonshotai/Kimi-K3 \
            --tokenizer /tmp/tok \
            --trust-remote-code \
            --dataset-name random \
            --random-input-len 8192 \
            --random-output-len 1024 \
            --random-range-ratio 0 \
            --num-prompts 10 \
            --max-concurrency 1 \
            --ignore-eos --seed 42 \
            --percentile-metrics ttft,tpot,itl,e2el \
            --metric-percentiles 50,90,99"
