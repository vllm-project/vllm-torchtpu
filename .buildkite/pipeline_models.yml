# Uploads the per-generation TPU model and feature test groups (v6e-group and
# v7x-group) in the tpu stage so they run in parallel with the other TPU suites
# before nightly_report summarizes them.

steps:
  - label: "Upload Tests for Models & Features"
    key: "upload_models_and_features"
    if: 'build.env("NIGHTLY") == "1" || build.tag =~ /^v?[0-9]+(\.[a-zA-Z0-9]+)*([a-zA-Z]+[0-9]*)?$/'
    agents:
      queue: cpu
    commands:
      - bash .buildkite/scripts/upload_models_and_features.sh
