# The unit test suite on the Kueue fleet. Keys match pipeline_tests.yml so the
# two read side by side; bootstrap.sh uploads one or the other (ci_fleet.sh),
# with the image build from pipeline_build.yml either way.
#
# The `tests` plugin runs on the agent and exports BUILDKITE_TEST_ENGINE_*;
# bktec runs in the pod, and run.sh forwards that configuration across - see
# common.sh for what happens to the credentials.

# Carries the launcher and the service account that may submit a workload.
# Repeated per step rather than merged in, because a step's `plugins:` is a list
# and a YAML merge key replaces it wholesale.
x-kube-plugin: &kube_plugin
  kubernetes:
    podTemplate: tpu-launcher

x-tpu-step-defaults: &tpu_step
  depends_on: "build_docker"
  # Covers queueing too: the agent pod starts at once and waits inside the
  # step, so this is the launcher's whole budget, not a test's length.
  timeout_in_minutes: 1440
  agents:
    queue: "kube"
  commands:
    # Exit 5 is pytest's "no tests collected", which a shard can legitimately
    # reach once the marker filter has emptied it. Tolerated inside the pod
    # because the launcher reports a workload as 0 or 1, so a 5 never survives
    # to be compared out here.
    - .buildkite/kubernetes/run.sh bash -c 'bktec run || [ $$? -eq 5 ]'

x-cpu-unit-test-defaults: &cpu_unit_test_defaults
  depends_on: "build_docker"
  # The fleet's cpu queue: a pod with no chip on an autoscaled CPU node, through
  # the same launcher as the TPU steps, so this lane needs no bare-metal agent
  # to run its tests.
  timeout_in_minutes: 120
  agents:
    queue: "kube"
  # Plain bktec, as on bare metal: these steps set fail-on-no-tests, so an
  # empty collection is a failure here rather than a shard emptied by a marker.
  commands:
    - .buildkite/kubernetes/run.sh bktec run
  env: &cpu_env
    SHAPE: "cpu"
    # What run_in_docker.sh's CPU_ONLY sets; without it JAX looks for a TPU.
    JAX_PLATFORMS: "cpu"

x-tests-plugin-defaults: &tests_plugin_defaults
  suite-slug: tpu-ci
  test-runner: pytest
  test-file-pattern: "tests/**/{test_*,*_test}.py"
  install-client: false
  oidc-lifetime: 7200
  # Each step's marker filter and per-test timeout are in its PYTEST_ADDOPTS,
  # which pytest reads on every invocation, bktec's `pytest --collect-only`
  # included, so splitting by example plans over the tests the step runs.
  test-cmd: "pytest -sv --junit-xml={{resultPath}} {{testExamples}}"

# Overridable to run on idle v6e, but only to prove the plumbing reaches a
# chip: several hundred kernel tests call pytest.fail rather than skip there,
# so a v6e run is red for reasons that say nothing about this lane.
x-shape-single: &shape_single "${KUBE_SHAPE_SINGLE:-tpu7x-standard-1t/1x1x1}"
x-shape-multi: &shape_multi "${KUBE_SHAPE_MULTI:-tpu7x-standard-4t/2x2x1}"

steps:
  # pyrefly in the CI image against .pyrefly-baseline-full.json, as on bare
  # metal. The pod already runs that image, but typecheck_full.sh decides it is
  # outside a container by looking for /.dockerenv, which a pod does not have,
  # and would try to start Docker.
  - label: ":kubernetes: Type Check - Full Environment"
    key: "typecheck_full"
    <<: *cpu_unit_test_defaults
    plugins:
      - *kube_plugin
    commands:
      - .buildkite/kubernetes/run.sh env TYPECHECK_IN_PLACE=1 bash tools/typecheck_full.sh

  - label: ":kubernetes: Unit Tests - CPU (PR)"
    key: "unit_tests_cpu_pr"
    <<: *cpu_unit_test_defaults
    if: 'build.env("NIGHTLY") != "1"'
    env:
      <<: *cpu_env
      PYTEST_ADDOPTS: "--timeout=600 -m 'not tpu_test and not multichip and not nightly'"
    plugins:
      - *kube_plugin
      - tests#v1.0.0:
          <<: *tests_plugin_defaults
          test-file-pattern: "tests/**/{test_*,*_test}.py"
          fail-on-no-tests: true

  - label: ":kubernetes: Unit Tests - CPU (Nightly)"
    key: "unit_tests_cpu_nightly"
    <<: *cpu_unit_test_defaults
    if: 'build.env("NIGHTLY") == "1"'
    env:
      <<: *cpu_env
      PYTEST_ADDOPTS: "--timeout=600 -m 'not tpu_test and not multichip'"
    plugins:
      - *kube_plugin
      - tests#v1.0.0:
          <<: *tests_plugin_defaults
          test-file-pattern: "tests/**/{test_*,*_test}.py"
          fail-on-no-tests: true

  - group: ":kubernetes: Unit Tests on TPU"
    steps:
      # test_speculative_decoding.py gets steps of its own so it runs on its
      # own chips rather than serializing behind everything else; the general
      # steps exclude the file so it is not run twice.
      #
      # Split by file, so a file that shares one engine across its tests starts
      # it in one shard only. bktec's split-by-example would not change that
      # here: it only divides files it considers slow.
      - label: ":kubernetes: Unit Tests - General (PR)"
        key: "unit_tests_general_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        parallelism: 4
        env:
          PYTEST_ADDOPTS: "--timeout=600 -m 'tpu_test and not nightly and not multichip'"
          SHAPE: *shape_single
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"

      - label: ":kubernetes: Unit Tests - Multichip (PR)"
        key: "unit_tests_multichip_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        parallelism: 2
        env:
          PYTEST_ADDOPTS: "--timeout=600 -m 'not nightly and multichip'"
          SHAPE: *shape_multi
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"

      # Representative correctness cases run on PRs; the full parameter matrix
      # and acceptance-rate tests run nightly. Split by example because the
      # suite is a single file.
      - label: ":kubernetes: Unit Tests - Speculative Decoding (PR)"
        key: "unit_tests_spec_decode_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        parallelism: 3
        env:
          SHAPE: *shape_single
          # Without the filter here (see x-tests-plugin-defaults), bktec would
          # plan the nightly-only cases into shards with their long timings and
          # then deselect them at run time.
          PYTEST_ADDOPTS: "--timeout=1800 -m 'not nightly and not multichip'"
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              split-by-example: true
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"

      - label: ":kubernetes: Unit Tests - Speculative Decoding Multichip (PR)"
        key: "unit_tests_spec_decode_multichip_pr"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") != "1"'
        env:
          PYTEST_ADDOPTS: "--timeout=3600 -m 'not nightly and multichip'"
          SHAPE: *shape_multi
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"

      # Omni multimodal and diffusion models, on the -omni image. The FLUX test
      # compares against a golden image under $HF_HOME/golden. Bare metal stages
      # it onto the host before the container starts; here only $HF_HOME/hub is
      # the shared cache, so the pod stages it with the same script. The weights
      # come through the shared cache, downloaded by the first run that needs
      # them.
      - label: ":kubernetes: Unit Tests - Omni (PR)"
        key: "unit_tests_omni_pr"
        <<: *tpu_step
        depends_on: "build_docker_omni"
        if: 'build.env("NIGHTLY") != "1"'
        env:
          PYTEST_ADDOPTS: "--timeout=1200 -m 'not nightly and omni'"
          SHAPE: *shape_single
          DOCKER_IMAGE_SUFFIX: "-omni"
        commands:
          - &omni_test |
            .buildkite/kubernetes/run.sh bash -c '
              bash .buildkite/scripts/stage_model_snapshot.sh gs://tpu-commons-ci/golden/ "$$HF_HOME" &&
              bktec run'
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests_omni/**/{test_*,*_test}.py"
              fail-on-no-tests: true

      - label: ":kubernetes: Unit Tests - Speculative Decoding (Nightly)"
        key: "unit_tests_spec_decode_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        parallelism: 4
        env:
          SHAPE: *shape_single
          PYTEST_ADDOPTS: "--timeout=600 -m 'not multichip'"
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              split-by-example: true
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"

      # The data-parallel MTP tests in the same file need DP*TP chips and
      # self-skip on the one-chip shape above, so this step is the only place
      # they run.
      - label: ":kubernetes: Unit Tests - Speculative Decoding Multichip (Nightly)"
        key: "unit_tests_spec_decode_multichip_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        parallelism: 2
        env:
          SHAPE: *shape_multi
          PYTEST_ADDOPTS: "--timeout=3600 -m 'multichip'"
          # The DSv4 DSpark tests compile DeepSeek-V4 on eight ranks, and the
          # saved artifacts reach ~70 GB within minutes. On the pod's ephemeral
          # storage that gets the pod evicted, and the Job reruns the whole file
          # until the launcher's deadline. The caches go to the compilation
          # bucket, as in the DSv4 manifests, and the inductor scratch to shm.
          VLLM_CACHE_ROOT: "/cache/jax/vllm"
          VLLM_XLA_CACHE_PATH: "/cache/jax/xla"
          TMPDIR: "/dev/shm"
          RAY_TMPDIR: "/tmp"
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              split-by-example: true
              test-file-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"

      - label: ":kubernetes: Unit Tests - General (Nightly)"
        key: "unit_tests_general_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        parallelism: 4
        env:
          PYTEST_ADDOPTS: "--timeout=600 -m 'tpu_test and not multichip'"
          SHAPE: *shape_single
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"

      - label: ":kubernetes: Unit Tests - Multichip (Nightly)"
        key: "unit_tests_multichip_nightly"
        <<: *tpu_step
        if: 'build.env("NIGHTLY") == "1"'
        parallelism: 2
        env:
          PYTEST_ADDOPTS: "--timeout=600 -m 'multichip'"
          SHAPE: *shape_multi
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-exclude-pattern: "tests/entrypoints/llm/test_speculative_decoding.py"

      - label: ":kubernetes: Unit Tests - Omni (Nightly)"
        key: "unit_tests_omni_nightly"
        <<: *tpu_step
        depends_on: "build_docker_omni"
        if: 'build.env("NIGHTLY") == "1"'
        env:
          PYTEST_ADDOPTS: "--timeout=1800 -m 'nightly and omni'"
          SHAPE: *shape_single
          DOCKER_IMAGE_SUFFIX: "-omni"
        commands:
          - *omni_test
        plugins:
          - *kube_plugin
          - tests#v1.0.0:
              <<: *tests_plugin_defaults
              test-file-pattern: "tests_omni/**/{test_*,*_test}.py"
              fail-on-no-tests: true
