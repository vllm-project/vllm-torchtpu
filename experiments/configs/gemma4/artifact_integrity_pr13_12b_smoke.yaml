description: "PR-13 artifact-integrity smoke evaluation on Gemma-4 12B: layers [], [0,1,2], [3,5,22]"
mode: eval

tensor_parallel_size: 4
dtype: bfloat16
max_model_len: 8192

engine_args:
  kv_cache_dtype: fp8
  max_num_batched_tokens: 4096
  max_num_seqs: 256
  gpu_memory_utilization: 0.85
  enable_prefix_caching: false
  disable_chunked_mm_input: true

evaluation:
  tasks: mmlu_pro
  limit: 0.01
  batch_size: auto
  seed: 42

model_resolver:
  module: resolvers.sparsegpt_resolver
  function: resolve_model
  config:
    base_model: /mnt/pd/huggingface_cache/hub/models--google--gemma-4-12B-it/snapshots/707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7
    reference_sparse_model: /mnt/pd/sparse_checkpoints/gemma4_12b_2of4_canonical_256c4_full
    checkpoint_base_dir: /mnt/pd/sparse_checkpoints
    strategy: first_to_last
    prunen: 2
    prunem: 4
    nsamples: 64

sweep_matrix:
  layers:
    - []
    - [0, 1, 2]
    - [3, 5, 22]
