description: "Gemma-4 12B Low-Rank Compensated (LRC: k=128, T=3, 2:4 sparsity) Stage L1 screening sweep on Cloud TPU v6e: dense control (0) vs prefix depths 8, 16, 24"
mode: eval

tensor_parallel_size: 4
dtype: bfloat16
max_model_len: 8192

engine_args:
  kv_cache_dtype: fp8
  max_num_batched_tokens: 4096
  max_num_seqs: 256
  gpu_memory_utilization: 0.85
  enable_prefix_caching: false
  disable_chunked_mm_input: true

evaluation:
  tasks: mmlu_pro
  limit: 0.05
  batch_size: auto
  seed: 42

model_resolver:
  module: resolvers.sparsegpt_resolver
  function: resolve_model
  config:
    base_model: google/gemma-4-12B-it
    reference_sparse_model: null
    checkpoint_base_dir: /mnt/pd/sparse_checkpoints
    strategy: first_to_last
    prunen: 2
    prunem: 4
    nsamples: 64
    use_lrc: true
    lrc_rank: 128
    lrc_iters: 3

sweep_matrix:
  num_sparse_layers: [0, 8, 16, 24]
