description: "PR-13 artifact-integrity smoke profile on Gemma-4 12B: dense baseline"
mode: profile

tensor_parallel_size: 4
dtype: bfloat16
max_model_len: 8192

engine_args:
  kv_cache_dtype: fp8
  gpu_memory_utilization: 0.85
  enable_prefix_caching: false
  disable_chunked_mm_input: true

model_resolver:
  module: resolvers.sparsegpt_resolver
  function: resolve_model
  config:
    base_model: google/gemma-4-12B-it
    reference_sparse_model: gemma4_12b_2of4_canonical_256c4_full
    # checkpoint_base_dir defaults to $CACHE_DIR/sparse_checkpoints (core/env.py)
    strategy: first_to_last
    prunen: 2
    prunem: 4
    nsamples: 64

sweep_matrix:
  layers:
    - []
  input_len: [128]
  output_len: [64]
  batch_size: [1]
