# Goal: Single-point throughput and latency profile with advanced TPU hardware tracing
# Model: Gemma 4 31B-IT (TP=4, BF16)
# Workload: batch_size=1, input_len=8192 (8k), output_len=1024 (1k)
# Hardware: Cloud TPU v6e-4 (4 chips)

mode: profile

tensor_parallel_size: 4
dtype: bfloat16
max_model_len: 16384

engine_args:
  enable_prefix_caching: false
  gpu_memory_utilization: 0.90

env_vars:
  VLLM_ENABLE_V1_MULTIPROCESSING: '0'

trace_configs:
  - batch_size: 1
    input_len: 8192
    output_len: 1024
    jax_advanced_configuration:
      tpu_num_chips_to_profile_per_task: 1
      tpu_trace_mode: "TRACE_COMPUTE"
      host_tracer_level: 0
      python_tracer_level: 0
      tpu_num_sparse_cores_to_trace: 0
      tpu_num_sparse_core_tiles_to_trace: 0

sweep_matrix:
  model: [google/gemma-4-31B-it]
  batch_size: [1]
  input_len: [8192]
  output_len: [1024]
