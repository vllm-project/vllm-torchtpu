# Goal: MMLU-Pro Quality Evaluation for Gemma 4 31B 1:4 Canonical Sparse Model under Constant Weight Multiplier (c)
mode: eval

tensor_parallel_size: 4
dtype: bfloat16
max_model_len: 8192

engine_args:
  kv_cache_dtype: fp8
  max_num_batched_tokens: 4096
  max_num_seqs: 256
  gpu_memory_utilization: 0.85
  enable_prefix_caching: false
  disable_chunked_mm_input: true

evaluation:
  tasks: mmlu_pro
  limit: 0.05
  batch_size: auto

model_resolver:
  module: resolvers.weight_scaler_resolver
  config:
    base_sparse_model: /mnt/pd/sparse_checkpoints/gemma4_31b_1of4_canonical_64c4_full
    output_base_path: /mnt/pd/sparse_checkpoints/gemma4_1of4_canonical_scaled_c

sweep_matrix:
  scale_factor: [0.80, 0.90, 0.95, 0.98, 1.00, 1.02, 1.05, 1.10, 1.15, 1.20, 1.25, 1.414, 2.00]
