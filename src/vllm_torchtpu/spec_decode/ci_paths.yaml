# Diff-aware CI path rules for speculative decoding (EAGLE-3, DFlash, DSpark, MTP).
# Owned jointly by spec_decode CODEOWNERS (@Lumosis @gxd3) and CI CODEOWNERS.
component: spec_decode
phase: phase2
reason: "spec_decode module changes"

path_prefixes:
  - "src/vllm_torchtpu/spec_decode/"

module_prefixes:
  - "vllm_torchtpu.spec_decode"

allowed_test_importers:
  - "tests/spec_decode/"
  - "tests/entrypoints/llm/test_speculative_decoding.py"
  - "tests/layers/adapter/test_indexer_topk_rows_update.py"
  - "tests/runner/test_tpu_runner_pp_profile.py"

allowed_external_importers:
  - "src/vllm_torchtpu/distributed/kv_transfer/tpu_connector.py"
  - "src/vllm_torchtpu/runner/speculative_decoding_manager.py"
  - "src/vllm_torchtpu/runner/tpu_runner.py"

build_docker_omni: false

test_steps:
  - "typecheck_full"
  - "unit_tests_cpu_pr"
  - "unit_tests_general_pr"
  - "unit_tests_multichip_pr"
  - "unit_tests_spec_decode_pr"
  - "unit_tests_spec_decode_multichip_pr"

general_test_pattern: "tests/spec_decode/**/{test_*,*_test}.py"
general_test_parallelism: 1

integration_steps: []
