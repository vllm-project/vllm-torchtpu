# Diff-aware CI: the PR TPU steps a change confined to `paths` needs. Owned by
# this folder's code owners and the CI owners; see .buildkite/ci_paths.yaml.
#
# Nothing outside experimental imports it, and its tests carry no TPU marker,
# so they run in the CPU unit-test step, which always runs. Add a step here
# when an experimental test starts running on TPU. (kernels/experimental/ is
# a different folder: shared code loads it, so it is not covered here.)
name: experimental
phase: phase2
paths:
  - src/vllm_torchtpu/experimental/
  - tests/experimental/
modules:
  - vllm_torchtpu.experimental
run_steps: []
