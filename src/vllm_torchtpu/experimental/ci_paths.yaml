# Diff-aware CI path rules for experimental standalone packages (e.g. export).
# Verified by Python AST import check in tests/scripts/test_select_pr_tests.py.
component: experimental
phase: phase2
reason: "experimental module changes"

path_prefixes:
  - "src/vllm_torchtpu/experimental/"

module_prefixes:
  - "vllm_torchtpu.experimental"

allowed_test_importers:
  - "tests/experimental/"

allowed_external_importers: []

build_docker_omni: false

test_steps:
  - "typecheck_full"
  - "unit_tests_cpu_pr"
  - "unit_tests_general_pr"

general_test_pattern: "tests/experimental/**/{test_*,*_test}.py"
general_test_parallelism: 1

integration_steps: []
