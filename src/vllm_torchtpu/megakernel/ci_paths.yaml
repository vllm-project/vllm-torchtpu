# Diff-aware CI path rules for the standalone JAX/Pallas megakernel library.
# Owned jointly by megakernel CODEOWNERS (@caojx-google @weinan1997 @hhb) and CI CODEOWNERS.
component: megakernel
phase: phase2
reason: "megakernel module changes"

path_prefixes:
  - "src/vllm_torchtpu/megakernel/"

module_prefixes:
  - "vllm_torchtpu.megakernel"

allowed_test_importers:
  - "tests/megakernel/"

allowed_external_importers: []

build_docker_omni: false

test_steps:
  - "typecheck_full"
  - "unit_tests_cpu_pr"
  - "unit_tests_general_pr"
  - "unit_tests_multichip_pr"

general_test_pattern: "tests/megakernel/**/{test_*,*_test}.py"
general_test_parallelism: 1

integration_steps: []
