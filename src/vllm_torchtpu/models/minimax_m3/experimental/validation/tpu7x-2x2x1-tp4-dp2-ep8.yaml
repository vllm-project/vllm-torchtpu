# Validation entry for MiniMax-M3.1-Flash (experimental tier: not in the
# support matrix yet). Baselines are single runs; calibrate noise with
# repeats before using them as gates.
model: MiniMaxAI/MiniMax-M3.1-Flash
tier: experimental
hardware: tpu7x 2x2x1 (4 chips, 8 cores)
serve:
  tensor_parallel_size: 4
  data_parallel_size: 2
  enable_expert_parallel: true
  max_model_len: 262144
  max_num_batched_tokens: 8192
  block_size: 128
  kv_cache_dtype: auto
  attention_backend: FLASH_ATTN
  attention_config: {indexer_kv_dtype: bf16}
  language_model_only: true
  enable_prefix_caching: true
  disable_hybrid_kv_cache_manager: true
  env:
    MOE_REQUANTIZE_BLOCK_SIZE: "128"
    MOE_FUSED_EP_KERNEL_IMPL: v2
    TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL: "0"
evals:
  gsm8k:  # lm-eval 5-shot, greedy, concurrency 32, n=1319
    exact_match_strict: 0.9606
    stderr: 0.0054
  longbench_v2:  # first 64 samples, thinking on, concurrency 32
    accuracy: 0.6094
    n: 64
perf:  # AgentX trace replay, 3600 s steady window
  - {concurrency: 4, median_tpot_ms: 31.6, median_ttft_ms: 1134, total_token_throughput: 7477}
  - {concurrency: 16, median_tpot_ms: 174.8, median_ttft_ms: 2707, total_token_throughput: 12378}
  - {concurrency: 48, median_tpot_ms: 639.1, median_ttft_ms: 17744, total_token_throughput: 8780}
  - {concurrency: 64, median_tpot_ms: 754.0, median_ttft_ms: 15757, total_token_throughput: 8406}
