# Accuracy gate, TP8 + DCP4 decode (the layout of points #5-#12), one prefill
# and one decode replica. See README.md in this directory.
name: gate-tp8-dcp4-1p1d
purpose: >-
  Accuracy of the main-based stack at the TP8 + DCP4 decode layout, and the
  cost of the Qwen3.5 FP8 trade-off settings, measured as an on/off pair.
  The submission tree has no gate of its own at this layout.
base_point: 8
chips: 8
legs:
  prefill:
    replicas: 1
    from: "the prefill leg of base_point"
  decode:
    replicas: 1
    from: "the decode leg of base_point"
    serve_args_override:
      # Real rejection sampling: drop the point's synthetic acceptance length.
      "--speculative-config": "{\"method\":\"mtp\",\"num_speculative_tokens\":3}"
decode_megakernel: "off"
arms:
  # The changes that add the FP8 trade-off settings add them to tradeoffs_on.
  tradeoffs_off:
    additional_config: {}
  tradeoffs_on:
    additional_config: {}
suite:
  gsm8k: {samples: 1319, chat_template_kwargs: {enable_thinking: true}, metric: strict-match}
  longbench: {}
  mtp_acceptance_length: real
  logprob_drift:
    against: tradeoffs_off
    prompts: fixed greedy prompt set
    report: [mean_abs_delta_logprob, max_abs_delta_logprob, top1_agreement]
noise:
  gsm8k_1319_samples: "+-0.42%"
references:
  - {job: j-0cdcabb5, tree: 7b45f3df2, layout: "TP8 + DCP4 1P1D", gsm8k: "98.10%"}
  - {job: j-017298cb, tree: 8fd4dd025, layout: "TP8 1P1D", gsm8k: "97.73%"}
  - {job: j-9818f652, tree: infx-qwen35-agentx-disagg-candidate2, layout: "TP8 MK ep, thinking on", gsm8k: "97.88%"}
