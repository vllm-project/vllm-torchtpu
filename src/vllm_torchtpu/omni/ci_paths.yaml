# Diff-aware CI path rules for the Omni multimodal & diffusion subsystem.
# Owned jointly by Omni CODEOWNERS (@mbohlool) and CI CODEOWNERS (@QiliangCui @theminghuang).
component: omni
phase: phase1
reason: "Omni changes"

path_prefixes:
  - "src/vllm_torchtpu/omni/"
  - "tests_omni/"
  - "tests/omni/"
  - "examples/omni/"

module_prefixes:
  - "vllm_torchtpu.omni"

allowed_test_importers:
  - "tests_omni/"
  - "tests/omni/"
  - "examples/omni/"

allowed_external_importers: []

build_docker_omni: true

test_steps:
  - "typecheck_full"
  - "unit_tests_cpu_pr"
  - "unit_tests_omni_pr"

integration_steps: []
