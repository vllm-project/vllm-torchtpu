# Diff-aware CI: the PR TPU steps a change confined to `paths` needs. Owned by
# this folder's code owners and the CI owners; see .buildkite/ci_paths.yaml.
#
# Omni runs on the -omni image, which only unit_tests_omni_pr uses, and
# nothing outside Omni imports it.
name: omni
phase: phase1
paths:
  - src/vllm_torchtpu/omni/
  - tests_omni/
modules:
  - vllm_torchtpu.omni
run_steps:
  - unit_tests_omni_pr
