# json_schema_default.yaml without complex_ast, for the Qwen3-0.6B accuracy gate
# in configs/qwen3-0.6b-structured-flat-json.sh. complex_ast.json nests with no
# depth bound, and on TPU v6e-4 Qwen3-0.6B hit max_tokens (finish_reason=length)
# on all 4 complex_ast prompts, which fails the 100% pass rule.
cases:
  - name: flat_json
    schema_path: ../structured_schemas/flat_json.json
    max_tokens: 1024
    prompts:
      - "Generate a JSON object with 10 fictional users for an enterprise directory, including varied roles and ages."
      - "Create a JSON roster of 10 software project members with realistic names, ages, emails, active flags, and roles."
      - "Return a JSON list of 10 customer support accounts under the users key matching the schema."
      - "Produce a JSON payload containing 10 university lab accounts with admin, user, and guest roles."

  - name: character_schema
    schema_path: ../structured_schemas/character_schema.json
    dataset_path: ../datasets/character_benchmark.json
    limit: 16
    max_tokens: 512

  - name: tool_call_arguments
    max_tokens: 512
    schema:
      type: object
      properties:
        tool_name:
          type: string
          enum:
            - query_logs
            - scale_deployment
            - run_sql_check
        arguments:
          type: object
          properties:
            service:
              type: string
              pattern: "^[a-z0-9-]+$"
            limit:
              type: integer
              minimum: 1
              maximum: 1000
            severity:
              type: string
              enum:
                - INFO
                - WARN
                - ERROR
          required:
            - service
            - limit
            - severity
          additionalProperties: false
      required:
        - tool_name
        - arguments
      additionalProperties: false
    prompts:
      - "Call query_logs for service gateway-router to fetch the latest 50 ERROR entries."
      - "Invoke scale_deployment on prefill-pool with limit 16 and severity INFO."
      - "Run run_sql_check for billing-api with limit 100 and severity WARN."
      - "Fetch the last 25 ERROR records from decode-worker using query_logs."
