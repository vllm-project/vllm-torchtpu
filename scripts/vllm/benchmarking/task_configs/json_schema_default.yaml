task: json_schema
request_mode: response_format
num_runs: 1
concurrency: 16
temperature: 0.0
max_tokens: 1024
thinking: false

cases:
  - name: flat_json
    schema_path: ../structured_schemas/flat_json.json
    max_tokens: 1024
    prompts:
      - "Generate a JSON object with 10 fictional users for an enterprise directory, including varied roles and ages."
      - "Create a JSON roster of 10 software project members with realistic names, ages, emails, active flags, and roles."
      - "Return a JSON list of 10 customer support accounts under the users key matching the schema."
      - "Produce a JSON payload containing 10 university lab accounts with admin, user, and guest roles."

  - name: complex_ast
    schema_path: ../structured_schemas/complex_ast.json
    max_tokens: 2048
    prompts:
      - "Generate exactly 10 depth-1 AST expressions where left and right are numbers (1 to 10), each with a 2-word description."
      - "Return exactly 10 shallow AST expressions where left is x or y and right is a single integer, each with a 2-word description."
      - "Produce exactly 10 flat comparison AST entries using ==, <, or > on two numbers, each with a 2-word description."
      - "List exactly 10 simple arithmetic AST entries where left and right are numbers (no nested Expression nodes) and description is 2 words."

  - name: character_schema
    schema_path: ../structured_schemas/character_schema.json
    dataset_path: ../datasets/character_benchmark.json
    limit: 16
    max_tokens: 512

  - name: tool_call_arguments
    max_tokens: 512
    schema:
      type: object
      properties:
        tool_name:
          type: string
          enum:
            - query_logs
            - scale_deployment
            - run_sql_check
        arguments:
          type: object
          properties:
            service:
              type: string
              pattern: "^[a-z0-9-]+$"
            limit:
              type: integer
              minimum: 1
              maximum: 1000
            severity:
              type: string
              enum:
                - INFO
                - WARN
                - ERROR
          required:
            - service
            - limit
            - severity
          additionalProperties: false
      required:
        - tool_name
        - arguments
      additionalProperties: false
    prompts:
      - "Call query_logs for service gateway-router to fetch the latest 50 ERROR entries."
      - "Invoke scale_deployment on prefill-pool with limit 16 and severity INFO."
      - "Run run_sql_check for billing-api with limit 100 and severity WARN."
      - "Fetch the last 25 ERROR records from decode-worker using query_logs."
