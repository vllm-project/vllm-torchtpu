# `qwen3.5-397b-fp8-tp8-dp1-ep-agentx@layers`, the variant the scorer derives from this one:
# the model cut to 4 of its 60 layers (3 Gated DeltaNet + 1 full-attention layer, every
# expert kept), served on one tpu7x 2x2x1 node through Cloud DevKit, and scored on the
# step-weighted device op time of the AgentX replay's own step shapes (the cells below).
