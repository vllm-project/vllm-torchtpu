# Example configuration for general XLA flag autotuning on Cloud TPUs.
#
# Customize this file for your model, serving configuration, and benchmark setup.
# You can use this with either local/in-pod execution or remote CDK orchestration.

model:
  # Model name or HuggingFace model repository identifier
  name: "meta-llama/Llama-3.1-70B-Instruct"
  # Local filesystem path or mounted Persistent Disk containing model weights
  model_path: "/models/Llama-3.1-70B-Instruct"
  # Port for vLLM server to listen on
  port: 8000
  # HTTP health endpoint for readiness checks
  health_endpoint: "/health"
  # Maximum wait time in seconds for server startup (allows for initial XLA compilation)
  startup_timeout_s: 3600
  # Base libtpu initialization flags applied to all trials (baseline and candidate)
  base_libtpu_init_args: >-
    --xla_tpu_use_minor_sharding_for_major_trivial_input=true
    --xla_enable_async_all_gather=true
  # Model-specific environment variables for the server process
  server_env:
    VLLM_XLA_CHECK_RECOMPILATION: "0"
  # Additional arguments passed directly to `vllm serve`
  serve_args:
    - "--tensor-parallel-size=8"
    - "--data-parallel-size=1"
    - "--max-model-len=8192"

benchmark:
  # Benchmark type: "vllm_bench_serve" (standard vLLM benchmark) or "custom_command"
  type: "vllm_bench_serve"
  # Target performance metric to optimize and rank candidates by
  target_metric: "total_token_throughput"
  # Number of unmeasured warmup passes before recording metrics
  warmup_runs: 1
  # Arguments passed directly to `vllm bench serve`
  args:
    dataset_name: "random"
    random_input_len: 2048
    random_output_len: 512
    num_prompts: 512
    max_concurrency: 64
    ignore_eos: true

cdk:
  # Registered recipe name in Cloud DevKit (cloud-devkit-recipes/recipes.yml)
  recipe: "torchtpu-vllm-benchmark"
  # Extra template parameters passed to `cdk job create`
  extra_recipe_params:
    WEIGHTS_PVC: "model-weights-pvc"
  # Polling interval in seconds to check job status
  poll_interval_s: 30
  # Maximum time in seconds before timing out a remote job
  job_timeout_s: 7200
  # Tags attached to CDK jobs for filtering and tracking
  tags:
    - "xla-autotune"
    - "agent-jobs"
